<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoScientist — статистика базы статей</title>
  <style>
    :root {
      color-scheme: dark;
      /* the main app's dark palette */
      --bg:#101319; --surface:#1d2026; --surface-2:#272a31; --line:rgba(255,255,255,.08);
      --ink:#e1e2eb; --ink-2:#c2c6d8; --ink-3:#8b93a7; --brand:#00daf3;
      /* one data series: a single validated hue (blue, dark step) on a same-hue track */
      --bar:#3987e5; --track:rgba(57,135,229,.16);
      /* status - always shown with a text label */
      --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.5; }

    /* ── top bar ── */
    #bar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
      padding:10px 24px; background:rgba(16,19,25,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
    .brand { font-weight:700; letter-spacing:.2px; font-size:15px; }
    .brand .dot { color:var(--brand); }
    .actions { margin-left:auto; display:flex; gap:8px; }
    .btn { display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); color:var(--ink);
      border:1px solid var(--line); border-radius:8px; padding:6px 12px; font:inherit; font-size:13px;
      text-decoration:none; cursor:pointer; }
    .btn:hover { border-color:rgba(255,255,255,.22); }
    .btn:disabled { opacity:.5; cursor:default; }
    .btn:focus-visible, tr:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }

    .pill { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:999px;
      padding:3px 11px; font-size:12px; font-weight:600; color:var(--ink-2); }
    .pill::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--ink-3); }
    .pill.ready::before { background:var(--good); }
    .pill.pending::before { background:var(--warn); }
    .pill.error::before { background:var(--crit); }

    /* ── page ── */
    main { padding:32px 24px 64px; }
    .container { max-width:1120px; margin:0 auto; }
    h1 { font-size:28px; line-height:1.2; font-weight:650; margin:0 0 6px; letter-spacing:-.2px; }
    .lede { color:var(--ink-3); margin:0 0 28px; }
    .lede p { margin:0; }

    .note { margin:0 0 20px; padding:12px 16px; border-radius:10px; border:1px solid var(--line);
      background:var(--surface); color:var(--ink-2); }
    .note.warn { border-color:rgba(250,178,25,.45); }
    .note.crit { border-color:rgba(208,59,59,.55); }
    .note code { font-family:var(--mono); font-size:12.5px; background:var(--bg); border:1px solid var(--line);
      border-radius:5px; padding:1px 5px; color:var(--ink); }

    #report.stale { opacity:.5; }   /* last good numbers, kept while the server is unreachable */

    .tiles { display:grid; grid-template-columns:1.6fr repeat(3, 1fr); gap:16px; margin:0 0 36px; }
    .tile { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
    .tile .value { font-size:34px; font-weight:650; line-height:1.1; letter-spacing:-.5px; }
    .tile .label { color:var(--ink-3); margin-top:6px; font-size:13px; }
    .tile.hero { background:linear-gradient(160deg, rgba(57,135,229,.16), rgba(57,135,229,0) 70%), var(--surface); }
    .tile.hero .value { font-size:56px; }
    .tile.hero .label { font-size:14px; color:var(--ink-2); }

    section.block { margin:0 0 36px; }
    section.block > h2 { font-size:18px; font-weight:650; margin:0 0 14px; }
    section.summary > h2 { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:6px 20px 10px; }
    .subgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(440px, 1fr)); gap:16px; }
    .card.sub { padding-top:16px; }
    .card.sub h3 { display:flex; align-items:baseline; justify-content:space-between; gap:12px;
      font-size:15px; font-weight:650; margin:0 0 4px; }
    .badge { color:var(--ink-3); font-weight:500; font-size:13px; white-space:nowrap; }
    .footnote { color:var(--ink-3); font-size:12.5px; margin:14px 2px 0; max-width:880px; }

    table.bars { width:100%; border-collapse:collapse; }
    table.bars th { text-align:left; font-size:12px; font-weight:500; color:var(--ink-3);
      padding:10px 0 8px; border-bottom:1px solid var(--line); }
    table.bars td { padding:9px 0; border-bottom:1px solid var(--line); vertical-align:middle; }
    table.bars tr:last-child td { border-bottom:0; }
    table.bars th.num, table.bars td.num { text-align:right; padding-left:16px; white-space:nowrap;
      font-variant-numeric:tabular-nums; }
    table.bars td.name { padding-right:12px; }
    table.bars tbody tr { cursor:default; }
    table.bars tbody tr:hover td, table.bars tbody tr:focus td { background:rgba(255,255,255,.03); }
    table.bars th.share, table.bars td.share { width:1%; white-space:nowrap; padding-left:28px; text-align:right; }
    .meter { display:inline-block; vertical-align:middle; width:168px; height:8px; margin-right:12px;
      background:var(--track); border-radius:4px; }
    .card.sub .meter { width:112px; }
    .meter > span { display:block; height:100%; background:var(--bar); border-radius:0 4px 4px 0; }
    .pct { display:inline-block; min-width:62px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-2); }

    .message { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px 22px;
      color:var(--ink-2); max-width:880px; }
    .message.working { position:relative; overflow:hidden; }
    .message.working::after { content:""; position:absolute; left:0; bottom:0; height:2px; width:30%;
      background:var(--bar); animation:slide 1.6s ease-in-out infinite; }
    @keyframes slide { from { transform:translateX(-100%); } to { transform:translateX(340%); } }
    @media (prefers-reduced-motion: reduce) { .message.working::after { animation:none; width:100%; opacity:.4; } }
    .empty { color:var(--ink-3); }
    pre.plain { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px;
      margin:0; overflow:auto; font-family:var(--mono); font-size:12.5px; line-height:1.55; }

    .tip { position:fixed; z-index:50; pointer-events:none; background:#0b0e14; color:var(--ink);
      border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:8px 11px; font-size:12.5px;
      box-shadow:0 6px 24px rgba(0,0,0,.45); max-width:320px; }
    .tip b { display:block; font-size:13.5px; font-weight:650; }
    .tip span { color:var(--ink-3); }

    @media (max-width: 860px) {
      .tiles { grid-template-columns:repeat(3, 1fr); }
      .tile.hero { grid-column:1 / -1; }
      .subgrid { grid-template-columns:1fr; }
      .meter, .card.sub .meter { width:96px; }
    }
    @media (max-width: 520px) {
      main { padding:24px 16px 48px; }
      #bar { padding:10px 16px; }
      .meter { display:none; }
      .card { padding:4px 14px 8px; }
      .card.sub { padding-top:14px; }
      table.bars th.num, table.bars td.num { padding-left:10px; }
      table.bars th.share, table.bars td.share { padding-left:12px; }
      table.bars th.share { white-space:normal; }
      .pct { min-width:0; }
      .tiles { grid-template-columns:1fr 1fr; }
      .tile.hero .value { font-size:44px; }
    }
  </style>
</head>
<body>
  <header id="bar">
    <span class="brand">CoScientist<span class="dot">.</span></span>
    <span id="state" class="pill">загрузка</span>
    <span class="actions">
      <a class="btn" href="/" title="Вернуться в приложение">К приложению</a>
    </span>
  </header>

  <main>
    <div class="container">
      <h1>Статистика базы статей</h1>
      <div id="lede" class="lede"></div>
      <div id="notice"></div>
      <div id="report" aria-live="polite"><p class="empty">Загрузка…</p></div>
    </div>
  </main>
  <div id="tip" class="tip" hidden></div>

<script>
// How often the page asks the web app again, by status. This is not how often the
// statistics change: the server checks the collection on its own schedule (the
// report's first line says how often) and the page just picks up its latest
// answer. A call is cheap - the server answers from memory.
const REFRESH_SECONDS = { ready: 60, pending: 10, unavailable: 30, not_configured: 60 };
const STATE_LABELS = { ready: "актуально", pending: "рассчитывается", unavailable: "нет связи", not_configured: "не настроено" };

let timer = null;
let lastReport = null;       // the last full report, kept on screen if a refresh fails
let loading = false;

const $ = id => document.getElementById(id);

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;   // text only, never HTML
  return node;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function plural(n, one, few, many) {
  n = Math.abs(n) % 100;
  if (n >= 11 && n <= 14) return many;
  n %= 10;
  if (n === 1) return one;
  if (n >= 2 && n <= 4) return few;
  return many;
}

// ── the report: Markdown from chroma_stats.format_paper_statistics ──────────
// Headings (##, ###), paragraphs and pipe tables - the subset the server writes.

function cells(row) {
  return row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
}

function parseMarkdown(md) {
  const lines = md.replace(/\r/g, "").split("\n");
  const blocks = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    const heading = /^(#{2,3})\s+(.+)$/.exec(line);
    if (heading) { blocks.push({ type: "h" + heading[1].length, text: heading[2].trim() }); i++; continue; }
    if (line.trim().startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(lines[i++]);
      const header = cells(rows[0]);
      const hasAlign = rows.length > 1 && /^[\s|:-]+$/.test(rows[1]) && rows[1].includes("-");
      const align = hasAlign ? cells(rows[1]).map(c => (c.endsWith(":") ? "right" : "left")) : header.map(() => "left");
      blocks.push({ type: "table", header, align, body: rows.slice(hasAlign ? 2 : 1).map(cells) });
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^#{2,3}\s/.test(lines[i]) && !lines[i].trim().startsWith("|")) {
      para.push(lines[i++].trim());
    }
    blocks.push({ type: "p", text: para.join(" ") });
  }
  return blocks;
}

function number(text) {
  return parseFloat(String(text).replace(/[^\d,.-]/g, "").replace(",", ".")) || 0;
}

function renderTiles(table) {
  const wrap = el("div", "tiles");
  table.body.forEach((row, i) => {
    const tile = el("div", i === 0 ? "tile hero" : "tile");
    tile.append(el("div", "value", row[1] ?? ""), el("div", "label", row[0] ?? ""));
    wrap.append(tile);
  });
  return wrap;
}

function renderBarTable(table) {
  const node = el("table", "bars");
  const share = table.header.length - 1;              // the last column holds the share
  const head = node.createTHead().insertRow();
  table.header.forEach((h, i) => {
    const th = el("th", i === share ? "share" : table.align[i] === "right" ? "num" : "", h);
    head.append(th);
  });
  const body = node.createTBody();
  for (const row of table.body) {
    const tr = body.insertRow();
    row.forEach((cell, i) => {
      const td = tr.insertCell();
      if (i === share && /%\s*$/.test(cell)) {
        td.className = "share";
        const meter = el("span", "meter");
        const fill = el("span");
        const pct = Math.max(0, Math.min(100, number(cell)));
        fill.style.width = pct > 0 ? `max(2px, ${pct}%)` : "0";
        meter.append(fill);
        td.append(meter, el("span", "pct", cell));
      } else {
        td.className = table.align[i] === "right" ? "num" : "name";
        td.textContent = cell;
      }
    });
    tr.tabIndex = 0;
    const count = number(row[1]);
    tr.dataset.value = `${row[1]} ${plural(count, "статья", "статьи", "статей")} · ${row[share]}`;
    tr.dataset.label = row[0];
  }
  return node;
}

function renderReport(md) {
  const blocks = parseMarkdown(md);
  const lede = $("lede");
  lede.replaceChildren();
  const out = document.createDocumentFragment();
  if (!blocks.some(b => b.type === "h2")) {           // not the Markdown report (older server): show as text
    out.append(el("pre", "plain", md));
    return out;
  }
  let section = null, grid = null, card = null, tiles = false;
  for (const b of blocks) {
    if (b.type === "p") {
      if (!section) lede.append(el("p", "", b.text));
      else (card || section).append(el("p", "footnote", b.text));
    } else if (b.type === "h2") {
      section = el("section", "block");
      section.append(el("h2", "", b.text));
      out.append(section);
      grid = null; card = null;
    } else if (b.type === "h3" && section) {
      if (!grid) { grid = el("div", "subgrid"); section.append(grid); }
      card = el("div", "card sub");
      const [title, badge] = b.text.split(" · ");
      const h3 = el("h3", "", title);
      if (badge) h3.append(el("span", "badge", badge));
      card.append(h3);
      grid.append(card);
    } else if (b.type === "table") {
      const host = card || section || out;
      if (!tiles && b.header.length === 2) {           // the summary: headline numbers as tiles
        tiles = true;
        if (section) section.classList.add("summary");
        host.append(renderTiles(b));
      } else if (card) {
        card.append(renderBarTable(b));
      } else {
        const wrap = el("div", "card");
        wrap.append(renderBarTable(b));
        host.append(wrap);
      }
    }
  }
  return out;
}

// ── hover / focus readout for table rows ────────────────────────────────────

const tip = $("tip");
function showTip(tr, x, y) {
  tip.replaceChildren(el("b", "", tr.dataset.value), el("span", "", tr.dataset.label));
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(x + 14, innerWidth - r.width - 8) + "px";
  tip.style.top = Math.min(y + 14, innerHeight - r.height - 8) + "px";
}
function hideTip() { tip.hidden = true; }
const report = $("report");
report.addEventListener("pointermove", e => {
  const tr = e.target.closest("tr[data-value]");
  tr ? showTip(tr, e.clientX, e.clientY) : hideTip();
});
report.addEventListener("pointerleave", hideTip);
report.addEventListener("focusin", e => {
  const tr = e.target.closest("tr[data-value]");
  if (tr) { const r = tr.getBoundingClientRect(); showTip(tr, r.left + 24, r.bottom - 6); }
});
report.addEventListener("focusout", hideTip);
addEventListener("scroll", hideTip, { passive: true });

// ── state ───────────────────────────────────────────────────────────────────

function setState(kind, label) {
  const pill = $("state");
  pill.className = "pill " + kind;
  pill.textContent = label;
}

function notice(kind, html) {
  $("notice").innerHTML = html ? `<div class="note ${kind}">${html}</div>` : "";
}

function render(data) {
  report.classList.remove("stale");
  hideTip();

  if (data.status === "ready") {
    lastReport = data.report;
    report.replaceChildren(renderReport(data.report));
    setState("ready", STATE_LABELS.ready);
    notice("", "");
    return;
  }

  if (data.status === "pending") {
    // No report yet: the first scan is running, or it failed. The server's message says which.
    // Its advice to ask again later is for agents; this page asks again by itself.
    const text = data.report.replace(/\s*Повторите запрос через несколько минут\.?/, "");
    $("lede").replaceChildren();
    const msg = el("div", /рассчитывается|готовится/.test(text) ? "message working" : "message", text);
    msg.append(el("p", "footnote", "Страница обновится сама, когда статистика будет готова."));
    report.replaceChildren(msg);
    setState("pending", STATE_LABELS.pending);
    notice("", "");
    return;
  }

  // unavailable / not_configured: keep the last good numbers on screen, dimmed.
  setState("error", STATE_LABELS[data.status] || STATE_LABELS.unavailable);
  if (lastReport) {
    report.replaceChildren(renderReport(lastReport));
    report.classList.add("stale");
  } else {
    $("lede").replaceChildren();
    report.replaceChildren(el("p", "message empty", "Нет данных для отображения."));
  }
  if (data.status === "not_configured") {
    notice("warn",
      "Веб-приложение не знает адрес MCP-сервера анализа статей. Укажите " +
      "<code>MCP__PAPER_ANALYSIS_URL</code> в файле <code>.env</code>, с которым запускается приложение " +
      "(например, <code>http://localhost:7331/mcp</code>), и перезапустите его.");
  } else {
    notice("crit",
      `Не удалось получить статистику: ${esc(String(data.error).replace(/\.\s*$/, ""))}. ` +
      (lastReport ? "Показаны последние полученные данные. " : "") +
      `Следующая попытка через ${REFRESH_SECONDS.unavailable} с.`);
  }
}

// Never throws: every failure becomes a status the page can show.
async function fetchStatistics() {
  let r;
  try {
    r = await fetch("/api/paper-statistics", { cache: "no-store" });
  } catch (e) {
    return { status: "unavailable", error: `веб-приложение не ответило (${e.message})` };
  }
  const data = await r.json().catch(() => null);
  if (data && data.status) return data;
  return { status: "unavailable", error: `веб-приложение ответило HTTP ${r.status} без статистики` };
}

async function load() {
  if (loading) return;
  loading = true;
  clearTimeout(timer);
  const data = await fetchStatistics();
  loading = false;
  render(data);
  timer = setTimeout(load, (REFRESH_SECONDS[data.status] || 30) * 1000);
}

// Coming back to the tab shows current numbers straight away.
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
