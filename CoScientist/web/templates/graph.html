<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/static/css/fonts.css" />
  <link rel="stylesheet" href="/static/css/framing_panel.css" />
  <title data-i18n="graph.title">CoScientist — Research Graph</title>
  <script src="/static/vis-network.min.js"></script>
  <!-- Placement only: ELK computes coordinates, vis-network draws. -->
  <script src="/static/elk.bundled.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/status_indicator.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <style>
    :root {
      --bg: #14161a; --surface: #1c1f26; --surface2: #23272f; --line: #2c313a;
      --ink: #e8eaed; --ink2: #9aa3af; --ink3: #6b7280;
      --good: #22c55e; --warn: #f59e0b; --crit: #ef4444; --info: #3b82f6;
      --accent: #38bdf8; --orange: #f97316; --slate: #64748b; --violet: #8b5cf6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: "Source Sans 3", -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; }

    /* top bar */
    #bar { position: fixed; top: 0; left: 0; right: 0; height: 46px; display: flex;
      align-items: center; gap: 16px; padding: 0 16px; background: var(--surface);
      border-bottom: 1px solid var(--line); z-index: 20; }
    #bar .brand { font-weight: 700; letter-spacing: .2px; }
    #bar .brand .dot { color: var(--accent); }
    #bar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      color: var(--ink2); user-select: none; }
    #bar select, #bar button { background: var(--surface2); color: var(--ink);
      border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
    #bar button:hover { border-color: var(--accent); }
    #status { color: var(--ink3); font-variant-numeric: tabular-nums; }
    .spacer { margin-left: auto; }

    /* research header (question + progress) */
    #head { position: fixed; top: 46px; left: 0; right: 0; z-index: 15; padding: 12px 16px;
      background: linear-gradient(180deg, var(--surface) 0%, rgba(28,31,38,.0) 100%);
      pointer-events: none; }
    #head.hidden { display: none; }
    #question { font-size: 15px; font-weight: 650; color: var(--ink); max-width: 62%;
      line-height: 1.35; margin-bottom: 10px; text-shadow: 0 2px 8px rgba(0,0,0,.5);
      /* A question written as a whole brief ran to eight lines and pushed the
         first band off the screen. Three lines here, the rest on hover and in
         the card the question has of its own. */
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; pointer-events: auto; cursor: default; }
    #question .q { color: var(--accent); font-weight: 700; }
    #counters, #meta, #gaps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    #counters { margin-bottom: 6px; }
    #counters .tile { font-size: 11px; font-weight: 600; padding: 2px 8px;
      border: 1px solid; border-radius: 999px; background: rgba(20,22,26,.72);
      font-variant-numeric: tabular-nums; }
    #meta { font-size: 11px; color: var(--ink3); margin-bottom: 6px; }
    /* #head ignores the mouse so the canvas stays draggable under it; the
       gaps banner is the one part meant to be read closely, so it takes
       pointer events back for its own tooltips. */
    #gaps { pointer-events: auto; }
    #gaps .gap { font-size: 11px; color: var(--warn); padding: 2px 8px;
      border: 1px dashed rgba(245,158,11,.45); border-radius: 7px;
      background: rgba(20,22,26,.72); }

    /* canvas + panels */
    #net { position: absolute; top: 46px; bottom: 0; left: 0; right: 0; }
    /* Width is a variable so the grip below and the panel agree; the reader
       drags the left edge and the width is remembered. The type is a size up
       from the canvas: the panel is read, the canvas is scanned. */
    :root { --dw: 480px; }
    #detail { position: fixed; top: 46px; right: 0; width: var(--dw); bottom: 0; background: var(--surface);
      border-left: 1px solid var(--line); padding: 0; overflow-y: auto; z-index: 18; display: none;
      box-shadow: -12px 0 32px rgba(0,0,0,.4); font-size: 14.5px; line-height: 1.5; }
    #dgrip { position: fixed; top: 46px; bottom: 0; right: calc(var(--dw) - 5px); width: 10px;
      cursor: col-resize; z-index: 19; display: none; touch-action: none; }
    #dgrip::after { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px;
      background: transparent; transition: background .12s; }
    #dgrip:hover::after, #dgrip.on::after { background: var(--accent); }
    body.resizing { cursor: col-resize; user-select: none; }
    body.resizing #detail { pointer-events: none; }
    #detail .dhead { padding: 18px 20px 14px; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; background: var(--surface); }
    #detail .dbody { padding: 16px 20px 28px; }
    #detail h3 { margin: 0 0 5px; font-size: 19px; word-break: break-word; }
    #detail .sub { color: var(--ink3); font-size: 13.5px; }
    #detail .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-weight: 700;
      font-size: 12.5px; margin-top: 8px; }
    #detail .close { float: right; cursor: pointer; color: var(--ink3); font-size: 22px; line-height: 1; }
    #detail .close:hover { color: var(--ink); }
    #detail .k { color: var(--accent); font-weight: 600; font-size: 12.5px; text-transform: uppercase;
      letter-spacing: .4px; margin: 14px 0 4px; }
    /* pre-wrap: a Method's tool list is one server per line, and a formulation
       written over several lines keeps them. */
    #detail .attr { margin: 3px 0; color: var(--ink); word-break: break-word;
      white-space: pre-wrap; }
    #detail .attr .ak { color: var(--ink2); }
    .chars { color: var(--ink3); font-size: 11.5px; letter-spacing: 0;
      text-transform: none; margin-left: 6px; }
    #detail pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); padding: 10px;
      border-radius: 8px; color: var(--ink); font-size: 13.5px; line-height: 1.5; margin: 4px 0 0;
      border: 1px solid var(--line);
      /* The whole value is here; long ones scroll rather than being cut. */
      max-height: 46vh; overflow-y: auto; }
    #detail .prov { background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--accent);
      border-radius: 8px; padding: 9px 11px; margin: 6px 0; cursor: pointer; transition: border-color .12s, background .12s; }
    #detail .prov:hover { border-color: var(--accent); background: #1a1f28; }
    #detail .prov .tool { font-weight: 700; color: var(--accent); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13.5px; }
    #detail .prov .jump { float: right; color: var(--accent); font-size: 11.5px; opacity: .65; }
    #detail .prov.dim { opacity: .55; }
    #detail .prov .res { color: var(--ink2); font-size: 13px; margin-top: 5px; line-height: 1.5;
      white-space: pre-wrap; overflow-wrap: anywhere; max-height: 160px; overflow-y: auto; }
    #detail .empty { color: var(--ink3); font-style: italic; }

    /* readable values: a mapping is labelled rows, not a wall of braces */
    .kv { margin-top: 2px; }
    .kv .row { display: grid; grid-template-columns: minmax(80px, max-content) 1fr; gap: 2px 12px;
      padding: 5px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
    .kv .row:last-child { border-bottom: 0; }
    .kv .key { color: var(--ink2); font-size: 13px; font-family: "IBM Plex Mono", ui-monospace, monospace;
      word-break: break-word; }
    .kv .val { color: var(--ink); font-size: 14px; line-height: 1.45; white-space: pre-wrap;
      overflow-wrap: anywhere; min-width: 0; }
    .kv .val.block { grid-column: 1 / -1; background: var(--bg); border: 1px solid var(--line);
      border-radius: 6px; padding: 7px 9px; max-height: 40vh; overflow-y: auto; }
    .kv .val.dim { color: var(--ink3); font-size: 12.5px; }
    .kv .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; }
    .kv .nested { grid-column: 1 / -1; margin-left: 10px; padding-left: 10px;
      border-left: 2px solid var(--line); }
    .kv ol.items { margin: 0; padding-left: 18px; color: var(--ink); font-size: 14px; }
    .kv ol.items li { margin: 3px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .kv ol.items li + li { border-top: 1px dashed var(--line); padding-top: 3px; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 13px;
      background: var(--surface2); border: 1px solid var(--line); color: var(--ink);
      margin: 0 4px 4px 0; white-space: nowrap; }

    /* tool-call history under an agent: a folded row each, opened on click */
    .call { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; background: var(--bg); }
    .call .hd { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer;
      user-select: none; }
    .call .hd:hover { background: #1a1f28; }
    .call .st { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .call .tool { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 700; font-size: 13.5px;
      color: var(--accent); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; }
    .call .when { color: var(--ink3); font-size: 12.5px; font-variant-numeric: tabular-nums;
      white-space: nowrap; }
    .call .caret { color: var(--ink3); font-size: 10px; transition: transform .12s; }
    .call.open .caret { transform: rotate(90deg); }
    .call .gist { color: var(--ink2); font-size: 13px; padding: 0 10px 8px 26px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .call .bd { display: none; padding: 0 10px 10px; border-top: 1px solid var(--line); }
    .call.open .bd { display: block; }
    .call .bd .k { margin-top: 10px; }
    .call.focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    /* an agent's report, rendered from its markdown */
    .report { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
      padding: 10px 12px; font-size: 14px; line-height: 1.55; max-height: 52vh; overflow-y: auto;
      overflow-wrap: anywhere; }
    /* The write-up card: the panel scrolls, so the document does not need to. */
    .report.full { max-height: none; overflow-y: visible; }
    .report > :first-child { margin-top: 0; } .report > :last-child { margin-bottom: 0; }
    .report h1, .report h2, .report h3, .report h4 { font-size: 15px; margin: 12px 0 4px; color: var(--ink); }
    .report h1 { font-size: 16.5px; }
    .report p, .report ul, .report ol { margin: 6px 0; } .report li { margin: 2px 0; }
    .report code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; background: var(--surface2);
      padding: 1px 4px; border-radius: 4px; }
    .report pre { max-height: none; margin: 6px 0; } .report pre code { background: none; padding: 0; }
    .report a { color: var(--accent); } .report img { max-width: 100%; border-radius: 6px; }
    .report table { border-collapse: collapse; font-size: 13px; }
    .report th, .report td { border: 1px solid var(--line); padding: 3px 6px; }
    .report blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--ink2); }
    /* artifacts: what the agent left behind */
    .art { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
    .art:last-child { border-bottom: 0; }
    .art .ic { flex: none; }
    .art .uri { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; overflow-wrap: anywhere; color: var(--ink); }
    /* A DOI or URL in a field row is an anchor too, and `.uri` was only ever
       styled inside `.art` — so the one link a reader most wants to press
       rendered as unstyled browser default. */
    #detail .kv .uri { color: var(--accent); overflow-wrap: anywhere; text-decoration: none; }
    #detail .kv .uri:hover { text-decoration: underline; }
    .art a.uri { color: var(--accent); text-decoration: none; } .art a.uri:hover { text-decoration: underline; }
    .art .by { color: var(--ink3); font-size: 12.5px; white-space: nowrap; margin-left: auto; }
    #detail .note { color: var(--ink3); font-size: 13px; font-style: italic; margin: 2px 0 0; }
    /* the on-request summary: a button until asked, then the model's lines */
    /* Two tabs in the head: the summary alone, or everything recorded. */
    .tabs { display: flex; gap: 6px; margin-top: 14px; }
    .tab { padding: 7px 16px; border-radius: 9px; font-size: 14.5px; font-weight: 600; color: var(--ink2);
      cursor: pointer; border: 1px solid transparent; user-select: none; }
    .tab:hover { color: var(--ink); }
    .tab.on { background: var(--surface2); color: var(--ink); border-color: var(--line); }
    /* The summary reads as a document, the way a markdown renderer shows it:
       no box, generous leading, real headings, lists and code. */
    .sumbox { margin: 4px 0 18px; }
    .sumbox .ask { padding: 26px 8px 10px; text-align: center; }
    .sumbtn { display: inline-flex; align-items: center; gap: 9px; background: var(--surface2);
      color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px 20px;
      font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
    .sumbtn:hover { border-color: var(--accent); color: var(--accent); }
    .sumbtn[disabled] { opacity: .6; cursor: progress; }
    .sumbox .hint { color: var(--ink3); font-size: 13.5px; margin-top: 12px; line-height: 1.5; }
    .mdoc { font-size: 17px; line-height: 1.7; color: var(--ink); overflow-wrap: anywhere; padding: 6px 2px 0; }
    .mdoc > :first-child { margin-top: 0; } .mdoc > :last-child { margin-bottom: 0; }
    .mdoc h1, .mdoc h2, .mdoc h3, .mdoc h4 { color: var(--ink); font-weight: 700; line-height: 1.3;
      margin: 22px 0 8px; }
    .mdoc h1 { font-size: 21px; } .mdoc h2 { font-size: 19px; } .mdoc h3 { font-size: 17.5px; }
    .mdoc h4 { font-size: 16.5px; color: var(--ink2); text-transform: uppercase; letter-spacing: .3px; }
    .mdoc p { margin: 10px 0; }
    .mdoc ul, .mdoc ol { margin: 8px 0; padding-left: 26px; }
    .mdoc li { margin: 5px 0; } .mdoc li::marker { color: var(--ink3); }
    .mdoc strong { color: #fff; }
    .mdoc code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 15px; background: var(--surface2);
      border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; }
    .mdoc pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
      margin: 10px 0; overflow-x: auto; font-size: 14.5px; line-height: 1.5; max-height: none; }
    .mdoc pre code { background: none; border: 0; padding: 0; font-size: inherit; }
    .mdoc blockquote { margin: 10px 0; padding: 2px 0 2px 14px; border-left: 3px solid var(--accent); color: var(--ink2); }
    .mdoc hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
    .mdoc a { color: var(--accent); } .mdoc img { max-width: 100%; border-radius: 6px; }
    .mdoc table { border-collapse: collapse; font-size: 15px; margin: 10px 0; }
    .mdoc th, .mdoc td { border: 1px solid var(--line); padding: 5px 10px; }
    .mdoc th { background: var(--surface2); }
    .sumbox .meta { display: flex; gap: 14px; align-items: baseline; color: var(--ink3); font-size: 13px;
      margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line); }
    .sumbox .meta a { color: var(--accent); cursor: pointer; text-decoration: none; }
    .sumbox .meta a:hover { text-decoration: underline; }
    .sumbox .err { color: var(--crit); font-size: 15px; margin: 12px 0 6px; line-height: 1.5; }
    .sumbox .stale { color: var(--warn); }
    /* pictures: any image the agent produced or linked is shown, not named */
    .pic { display: block; margin: 8px 0 4px; }
    .pic img { max-width: 100%; max-height: 60vh; border-radius: 8px; border: 1px solid var(--line);
      background: #fff; cursor: zoom-in; display: block; }
    .art { flex-wrap: wrap; } .art .pic { flex-basis: 100%; }
  </style>
</head>
<body>
  <div id="bar">
    <span class="brand">CoScientist <span class="dot">◆</span> <span data-i18n="graph.brand">Graph</span></span>
    <label><span data-i18n="graph.view.label">view</span>
      <select id="view">
        <option value="research" data-i18n="graph.view.research">research</option>
        <option value="execution" data-i18n="graph.view.execution">execution log</option>
      </select>
    </label>
    <label id="turnWrap" style="display:none"><span id="turnLabel">request</span>
      <select id="turn" style="max-width:340px"></select>
    </label>
    <label><input type="checkbox" id="auto" checked /> <span data-i18n="graph.live">live</span></label>
    <label id="autoReportWrap" style="display:none"><input type="checkbox" id="autoReport"
      onchange="toggleAutoNodeReports(this)" /> <span data-i18n="graph.nodeReport.auto">write node reports</span></label>
    <button id="refresh" data-i18n-title="graph.refresh">↻</button>
    <span class="spacer"></span>
    <span id="status" data-i18n="graph.connecting">connecting…</span>
      <a id="totrace" href="/trace" style="margin-left:auto;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12px;text-decoration:none" data-i18n="graph.backTrace">← session trace</a>
  </div>

  <div id="head">
    <div id="question"></div>
    <div id="counters"></div>
    <div id="meta"></div>
    <div id="gaps"></div>
  </div>

  <div id="net"></div>
  <div id="dgrip" title="drag to resize · double-click to reset"></div>
  <div id="detail"></div>

  <script>
    // ══════════════════════════════════════════════════════════════════════════
    //  Encoding — COLOR = status (reserved status palette), ICON = type,
    //  GLYPH = status (so identity is never colour-alone; CVD-safe).
    // ══════════════════════════════════════════════════════════════════════════
    const C = getComputedStyle(document.documentElement);
    const col = n => C.getPropertyValue(n).trim();
    const GOOD=col('--good'), WARN=col('--warn'), CRIT=col('--crit'), INFO=col('--info'),
          ORANGE=col('--orange'), SLATE=col('--slate'), VIOLET=col('--violet'), INK=col('--ink'),
          INK2=col('--ink2');

    const R_STATUS = {  // status -> {color, glyph, label}
      confirmed:{c:GOOD,g:'✓'}, validated:{c:GOOD,g:'✓'}, met:{c:GOOD,g:'✓'},
      available:{c:GOOD,g:'✓'}, done:{c:GOOD,g:'✓'}, approved:{c:GOOD,g:'✓'},
      refuted:{c:CRIT,g:'✗'}, rejected:{c:CRIT,g:'✗'}, failed:{c:CRIT,g:'✗'}, creation_failed:{c:CRIT,g:'✗'},
      // Tested and not settled: neither a verdict nor an untouched branch.
      inconclusive:{c:ORANGE,g:'≈'},
      under_verification:{c:WARN,g:'⧗'}, running:{c:WARN,g:'⧗'}, obtained:{c:INFO,g:'●'}, draft:{c:WARN,g:'✎'},
      formulated:{c:INFO,g:'○'}, open:{c:INFO,g:'○'}, planned:{c:INFO,g:'○'}, not_met:{c:INFO,g:'○'},
      // The plan track's own vocabulary, which this table simply did not know:
      // a step in progress and a step nobody had started both fell through to
      // the default and drew as the same slate bullet, so the one question the
      // plan column exists to answer — what is going on right now — had the
      // same answer everywhere on it.
      todo:{c:INFO,g:'○'}, in_progress:{c:WARN,g:'⧗'},
      blocked:{c:CRIT,g:'⊗'}, skipped:{c:SLATE,g:'⊘'},
      // A method's own three. It is the MEANS, never work: it is offered, the
      // study leans on it, or it is left aside.
      proposed:{c:INFO,g:'○'}, used:{c:GOOD,g:'✓'}, not_used:{c:SLATE,g:'⊘'},
      needs_adaptation:{c:ORANGE,g:'⚙'}, being_created:{c:ORANGE,g:'⚙'},
      postponed:{c:SLATE,g:'⏸'}, exhausted:{c:SLATE,g:'∅'}, decomposed:{c:SLATE,g:'⊟'}, closed:{c:SLATE,g:'●'},
      active:{c:VIOLET,g:'▮'}, created:{c:SLATE,g:'▢'},
      // The two derived cards: a summary, not a state anything moves through.
      derived:{c:SLATE,g:'▣'},
    };
    const rStatus = s => R_STATUS[s] || {c:SLATE,g:'•'};
    // What KIND of thing a card is, in colour — for EVERY kind, with no
    // exceptions and no two the same. Status used to be the only thing colour
    // said, which made an `open` question and a `planned` method the same
    // blue; the first fix moved colour onto the type but left `Hypothesis` out
    // of the table so it could keep carrying its verdict, and that put the
    // study's central claim on the status palette: a hypothesis
    // `under_verification` came out amber, which is where `Evidence` already
    // lives. The two cards a reader most needs to tell apart were the one pair
    // that looked alike.
    //
    // Two rules hold this table together:
    //   * every type in the server's NODE_TYPES appears exactly once, with a
    //     hue no other type uses — a card's colour answers "what is this?"
    //     before a word is read;
    //   * no type may take `--good` or `--crit`. Green and red are the
    //     verdict's, and a green card would read as a confirmed one whatever
    //     its label said.
    // Both are pinned by tests, because neither fails visibly: a duplicate
    // just makes two types look the same, which is the defect this replaces.
    const R_KIND = {
      // The setup, agreed with the operator: one family, three weights.
      framing:              "#d29922",  // gold
      constraint:           "#b45309",  // burnt amber — the setup's boundary
      empiricalbase:        "#0ea5e9",  // sky: where the material came from
      resource:             "#84cc16",  // lime: what the run is allowed to use
      researchquestion:     "#3b82f6",  // blue: what was asked
      // The claim the whole study exists to settle. Yellow because it is the
      // one card a reader should find first, and because it is far from both
      // the verdict colours and from the orange of an observation.
      hypothesis:           "#facc15",
      confirmationcriteria: "#8b5cf6",  // violet: the bar
      verificationmethod:   "#14b8a6",  // teal: by what means
      planstep:             "#64748b",  // slate: the intention, background
      // The same track one grain finer, and deliberately NOT a shade of the
      // step's slate: a reader has to tell the general plan from the detailed
      // one at a glance.
      experimenttask:       "#e879f9",  // magenta
      tool:                 "#a9682a",  // brown: the instrument
      evidence:             "#f97316",  // orange: what was measured
      generateddata:        "#06b6d4",  // cyan: what the run produced
      codeartifact:         "#f472b6",  // pink: the code that produced it
      conclusion:           "#fdba74",  // light orange: what it adds up to
      // Paper: the deliverable is the one card that should look like a
      // document, and near-white is a tone no other type can be given.
      // It also keeps green off the cards entirely — see the rule above.
      report:               "#e2e8f0",
      publication:          "#a855f7",  // purple
      spec:                 "#6366f1",  // indigo
      outcome:              "#94a3b8",  // light slate: the summary card
      // The efficiency family, rare and always together, so they are told
      // apart from each other rather than from the rest of the graph.
      efficiencyjustification: "#2dd4bf",
      efficiencymetric:        "#22d3ee",
      costmodel:               "#c2410c",
    };
    // Which statuses are a verdict, and which way. Everything absent from both
    // sets is neither — in progress, postponed, not yet measured — and reads in
    // neutral ink. `inconclusive` belongs there too: it is the honest "we
    // measured and it did not settle", not a failure.
    const STATUS_GOOD = new Set(["confirmed", "validated", "met", "approved",
                                 "done", "available", "used"]);
    const STATUS_BAD = new Set(["refuted", "rejected", "failed", "creation_failed"]);
    // …and a third thing, which is neither: what is happening RIGHT NOW. Left
    // in neutral ink it read exactly like a card nobody had touched, which is
    // the complaint this whole table exists to answer — the study says which
    // stage is going, and the reader could not see it.
    const STATUS_LIVE = new Set(["in_progress", "running", "under_verification"]);
    const statusInk = st => STATUS_GOOD.has(st) ? GOOD
                          : STATUS_BAD.has(st) ? CRIT
                          : STATUS_LIVE.has(st) ? WARN : INK2;

    const R_ICON = { researchquestion:'❓', hypothesis:'💡', evidence:'🔬', conclusion:'✅',
      verificationmethod:'⚙️', confirmationcriteria:'🎯', tool:'🔧', resource:'🔋',
      empiricalbase:'🗄️', constraint:'⚖️', codeartifact:'💻', generateddata:'📦',
      report:'📑', publication:'📰', spec:'📋', efficiencyjustification:'📈',
      costmodel:'💰', efficiencymetric:'📊', framing:'🧩', outcome:'▣' };
    const R_LEVEL = { researchquestion:0, constraint:0, hypothesis:1, empiricalbase:1,
      verificationmethod:2, confirmationcriteria:2, tool:2,
      // The plan track. Absent from this table the two of them were not in
      // `RESEARCH_KINDS` either, and the tooltip of the very cards a reader
      // watches for progress printed the raw code — "experimenttask",
      // "in_progress" — instead of the words on the card beside it.
      planstep:2, experimenttask:2,
      evidence:3, resource:3, generateddata:3, codeartifact:3, conclusion:4,
      report:5, publication:5, spec:5, efficiencyjustification:5, costmodel:5, efficiencymetric:5,
      framing:0, outcome:5 };
    const R_EDGE = { supports:GOOD, refutes:CRIT, refines:WARN,
      supersedes:SLATE, conditional_successor:WARN, frames:SLATE, concludes:INFO };
    // An untyped link — motivates, tested_by, produces, uses — used to be
    // drawn in #4a5160 on a #14161a canvas, and its label in #aeb6c2 at 12px.
    // Three stops off the background is invisible past a dozen cards, and on
    // this study most links are untyped. "Black", on a dark canvas, is the
    // light end of the range.
    const EDGE_NEUTRAL = "#cbd5e1", EDGE_BRIGHT = "#ffffff";
    //: The plan links (realises, elaborates) stay subordinate — they say which
    //: intention a record serves, not what the study found — but subordinate is
    //: not the same as unreadable.
    const EDGE_QUIET = "#94a3b8";
    const EDGE_HALO = "#14161a";
    //: A label is typeset by the same parser as a card, so a real weight is
    //: available: escape the text and wrap it in <b>. Bigger type would have
    //: been the other way to be noticed, and it costs room a graph does not
    //: have.
    const edgeLabel = v => { const e = visSafe(String(v == null ? "" : v));
                             return e ? "<b>" + e + "</b>" : ""; };
    const edgeFont = (color, size) => ({ color, size: size || 13, multi: "html",
                                         strokeWidth: 5, strokeColor: EDGE_HALO,
                                         bold: { color, size: size || 13, mod: "bold" } });
    // Human-readable type names (shown as "Hypothesis 1" instead of the terse id
    // "H1") and edge phrases, so a first-time viewer instantly reads the graph.
    const R_TYPE_NAME = { researchquestion:"Question", hypothesis:"Hypothesis", evidence:"Evidence",
      conclusion:"Conclusion", verificationmethod:"Method", confirmationcriteria:"Criteria",
      tool:"Tool", resource:"Resource", empiricalbase:"Data source", constraint:"Constraint",
      codeartifact:"Code", generateddata:"Dataset", report:"Report", publication:"Publication",
      spec:"Spec", efficiencyjustification:"Efficiency", costmodel:"Cost model",
      efficiencymetric:"Metric", framing:"Technical specification", outcome:"Outcome" };
    const R_EDGE_NAME = { motivates:"motivates", tested_by:"tested by", requires:"requires",
      uses:"uses", consumes:"consumes", produces:"produces", supports:"supports", refutes:"refutes",
      refines:"refines", based_on:"based on", determines_sufficiency:"sufficiency for",
      formulated_for:"criterion for", regulates:"regulates", constrains:"constrains",
      derived_from:"derived from", contextualizes:"frames", defines_scope:"scope of",
      relates_to:"relates to", applies_to:"applies to",
      conditional_successor:"if refuted, continue with", via:"via" };
    // The server now names the type and the status in the words a scientist
    // uses; the client keeps its own table only as a fallback for older data.
    const rTypeName = n => {
      if (n.type_word) return n.type_word;
      const key = "graph.type." + n.kind;
      return t(key, R_TYPE_NAME[n.kind] || n.kind || "");
    };
    const rStatusWord = n => n.status_word || String(n.status || "").replace(/_/g, " ");
    const RESEARCH_KINDS = new Set(Object.keys(R_LEVEL));
    // There is no client-side allow-list any more. What the canvas draws is
    // decided by the store, which folds the engineering record (tools, budget,
    // datasets, code) into the card it belongs to and re-points its edges. The
    // list that used to live here dropped those nodes AND every edge touching
    // one, which in a real session was every edge there was.
    // hex -> "r,g,b" for translucent fills
    function channels(hex){ const m = String(hex).replace('#','').trim();
      return m.length===3 ? m.split('').map(x=>parseInt(x+x,16))
                          : [0,2,4].map(i=>parseInt(m.slice(i,i+2),16)); }
    function rgba(hex, a){ const v = channels(hex);
      return `rgba(${v[0]},${v[1]},${v[2]},${a})`; }

    // A card on the canvas must be OPAQUE.
    //
    // vis draws every edge before it draws any node (`_drawEdges` then
    // `_drawNodes`), so a card painted at 14% alpha lets the wires running
    // beneath it straight through — across the label, which is what made the
    // graph hard to read. Compositing the very same tint over the canvas colour
    // keeps each card looking exactly as it did and gives its text something
    // solid to sit on. The blend base is read from `--bg`, so a theme change
    // moves the cards with it instead of leaving them a shade off.
    let _canvasRgb = null;
    function canvasRgb(){
      if (!_canvasRgb) {
        let v = null;
        try {
          const css = getComputedStyle(document.documentElement)
            .getPropertyValue('--bg').trim();
          if (/^#?[0-9a-f]{3}([0-9a-f]{3})?$/i.test(css)) v = channels(css);
        } catch (err) { v = null; }
        _canvasRgb = (v && v.every(x => Number.isFinite(x))) ? v : [0x14, 0x16, 0x1a];
      }
      return _canvasRgb;
    }
    function solid(hex, a){
      const v = channels(hex), b = canvasRgb();
      const mix = v.map((x, i) => Math.round(x * a + b[i] * (1 - a)));
      return `rgb(${mix[0]},${mix[1]},${mix[2]})`;
    }

    // ── execution view styling ────────────────────────────────────────────────
    // One tint per stretch of a run: enough to tell them apart behind the
    // cards, never enough to compete with a node's own status colour.
    const PHASE_FILL = {
      framing:    "rgba(59,130,246,0.07)",
      research:   "rgba(56,189,248,0.07)",
      experiment: "rgba(249,115,22,0.07)",
      report:     "rgba(34,197,94,0.07)",
    };
    const PHASE_EDGE = {
      framing:    "rgba(59,130,246,0.40)",
      research:   "rgba(56,189,248,0.40)",
      experiment: "rgba(249,115,22,0.40)",
      report:     "rgba(34,197,94,0.40)",
    };
    let lastPhases = [];

    const STATUS_COLOR = { running:"#f1c40f", success:"#22c55e", failed:"#ef4444", interrupted:"#e67e22", pruned:"#64748b" };
    // Identity fills the node; status rings it. Colouring agents by identity
    // alone made a stuck "running" agent look exactly like a finished one, so
    // the only nodes that showed progress were goals and tool calls.
    const IDENTITY_COLOR = { system:"#f4c542", agent:"#7eb6ff", agent_call:"#7eb6ff" };
    // Every node in the log is a labelled box. Dots, diamonds and stars made a
    // trace read as a diagram of shapes; a run reads better as a row of cards
    // whose text you can scan.
    const SHAPE = { system:"hexagon" };
    const statusColor = n => STATUS_COLOR[n.status] || "#cbd5e1";
    const colorOf = n => IDENTITY_COLOR[n.kind] || statusColor(n);
    const borderOf = n => IDENTITY_COLOR[n.kind] ? statusColor(n) : "#20232a";
    const shapeOf = n => SHAPE[n.kind] || "box";
    // How long it took, in the unit a reader thinks in: a sandbox run that
    // waited six hours is "5h 51m", not "21081.8s".
    const secsOf = n => {
      if (!(n.t_end && n.t_start)) return "";
      const s = n.t_end - n.t_start;
      if (s < 1) return s.toFixed(2) + "s";
      if (s < 60) return s.toFixed(1) + "s";
      if (s < 3600) return Math.floor(s / 60) + "m " + Math.round(s % 60) + "s";
      return Math.floor(s / 3600) + "h " + Math.round((s % 3600) / 60) + "m";
    };
    // When the call was made. The canvas already places nodes along a time
    // axis, but reading a position off an axis is not the same as being told
    // the hour — and it is what a reader matches against a log line.
    const clockOf = n => {
      if (!n.t_start) return "";
      const d = new Date(n.t_start * 1000);
      const pad = v => String(v).padStart(2, "0");
      return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    };
    // Started at, then how long it took, on one line so a card stays two deep.
    const metaOf = n => [clockOf(n), secsOf(n)].filter(Boolean).join("  ·  ");
    // Kind first, then what it was, then when and how long: the things a
    // reader of a trace is after.
    function labelOf(n){
      const meta = metaOf(n);
      const tail = meta ? "\n" + meta : "";
      if (n.kind === "goal")
        return "❯ " + String(n.label || t('graph.detail.request')).slice(0, 90) + tail;
      if (n.kind === "result")
        return "✔ " + t('graph.detail.answer') + tail;
      if (n.kind === "agent" || n.kind === "agent_call") {
        // Numbered in the order the stages ran; an agent that ran more than
        // once in the request says which run this is, so a loop reads as one.
        // Its tool calls are folded into the card; the count says there is
        // something to open, and how much.
        const calls = Array.isArray(n.calls) ? n.calls.length : 0;
        const name = String(n.executor_agent ? shortAgent(n.executor_agent) : (n.label || "")).slice(0, 30);
        return (n.stage ? n.stage + ". " : "") + name
          + (n.runs > 1 ? "  (" + t('graph.detail.runOf', { run: n.run, runs: n.runs }) + ")" : "") + tail
          + (calls ? "\n🛠 " + t('graph.count.calls', { count: calls }) : "");
      }
      // A decision is written for its card — the Experiment Module's plan says
      // "plan rev 2 · 4 tasks · 90 min" — so it keeps its whole line where a
      // tool result, which is a dump, is cut to a headline.
      if (n.kind === "decision")
        return "📋 " + String(n.label || "decision").slice(0, 70) + tail;
      return String(n.label || n.id || "").slice(0, 30) + tail;
    }

    const isResearch = () => document.getElementById("view").value === "research";

    function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    // For canvas labels ONLY — never for innerHTML, which still needs esc().
    //
    // vis-network 10.1.0 parses a multi:"html" label with its own tokenizer, and
    // the moment it meets an '&' it calls its two-argument replace() with three
    // arguments: the whole label becomes the pattern and is compiled as
    // `new RegExp(<the entire card text>)`. Any '(' or '[' left unbalanced by
    // the 190-character cut then throws SyntaxError — out of the node loop, so
    // the canvas stayed blank and every later poll threw on the same cached
    // label until the page was reloaded.
    //
    // Escaping to "&amp;" makes it strictly worse: agents write plain '&' too
    // ("Rassabina & Fedorov"). So no '&', '<' or '>' may reach the label at all;
    // the <b>/<i>/<code> we do want is added after this runs. Full-width '＆',
    // '＜' and '＞' read as their ASCII twins and are inert to the tokenizer.
    // Deleting the brackets instead cost the meaning: a criterion reading
    // "SA <= 3.5" was drawn as "SA  = 3.5", which is a different threshold.
    function visSafe(s){
      return String(s == null ? "" : s)
        .replace(/<=/g, "≤").replace(/>=/g, "≥")
        .replace(/</g, "＜").replace(/>/g, "＞")
        .replace(/&/g, "＆");
    }
    function rText(n){ return String(n.output||n.label||"").replace(/\s+/g," ").trim(); }
    // A card is a headline, not the document. Seven hundred characters of
    // formulation per node turned the canvas into a wall of prose nobody scans;
    // the whole text is one click away in the panel, so the card carries the
    // first sentence and the facts you scan for: what it is, how it stands, who
    // wrote it, and whether a tool call backs it.
    function firstSentence(text, cap){
      const trimmed = String(text || "").replace(/\s+/g, " ").trim();
      if (trimmed.length <= cap) return trimmed;
      const stop = trimmed.slice(0, cap).search(/[.!?;](?=\s|$)[^]*$/);
      const cut = trimmed.lastIndexOf(" ", cap);
      return trimmed.slice(0, stop > cap * 0.4 ? stop + 1 : (cut > 0 ? cut : cap)) + " …";
    }
    // Five lines, in the order a reader asks for them: WHAT this is and how it
    // stands, what it says, what it is checked by (or where it came from), what
    // it was built with, and who recorded it. A step that ended badly says WHY
    // on the card itself — that answer used to live in the store and never
    // reach the page, so a failed method drew as "не удался" and stopped there.
    // No pictograms on the canvas. A method card carried five or six of them —
    // ⚙️ for the type, 🎯 twice, 📎, 🛠️ — on a box 230 px wide, and none of
    // them said anything the words beside them did not. The status glyph stays:
    // ✓ ✗ ⧗ ○ is a typographic mark that carries the verdict, and it is the
    // one thing on the card that is read at a glance rather than word by word.
    function researchLabel(n){
      const st = rStatus(n.status);
      const idx = n.index && n.kind !== "researchquestion" ? " " + n.index : "";
      const sw = rStatusWord(n);
      const L = [];
      // The type in ink, the status in the verdict's colour. Both are bold;
      // the status word is wrapped in <b><i> so it lands on the `boldital`
      // class, which `researchNode` gives the status colour and a plain bold
      // weight — the only way to get two colours into one vis label.
      const head = visSafe(st.g + " " + rTypeName(n) + idx);
      L.push(sw ? "<b>" + head + " · </b><b><i>" + visSafe(sw) + "</i></b>"
                : "<b>" + head + "</b>");
      // A headline, still — but a wider one than the cramped column layout
      // could afford. At 150 characters an observation was cut before its
      // numbers ("mean AD=59.7%; …"), which is the part a reader came for.
      const body = firstSentence(rText(n), 210);
      if (body) L.push(visSafe(body));
      if (n.why)
        L.push("<i>" + visSafe(st.g + " " + t('graph.why.title') + ": "
                               + firstSentence(n.why, 110)) + "</i>");
      else if (n.why_missing)
        L.push("<i>" + visSafe(t('graph.why.missing')) + "</i>");
      // What the method answers, and — when two plan steps read alike — the step
      // that tells this card from its twin. Four look-alike method cards left
      // the reader no way to know why there were four.
      if (n.tests)
        L.push(visSafe(t('graph.card.tests') + " "
                       + firstSentence(n.tests, 80)));
      if (n.plan_step)
        L.push("<code>" + visSafe(String(n.plan_step).slice(0, 24)) + "</code>");
      // WITH WHAT. A method is a method of a claim, for settling it, BY some
      // instrument — and the card carried only the first two, so every method
      // read as a restated task. The reference drawing hangs the tool names
      // right on the method box, and that is what makes it answerable: a
      // reader can see the LD50 came out of ADMETlab and not out of a model's
      // recollection.
      // No slice: the store decides how many instruments a card names
      // (`_MAX_INSTRUMENTS`), and a second, smaller cap here meant the last of
      // them were polled to the browser and drawn nowhere.
      if (n.instruments)
        L.push(String(n.instruments).split(",")
               .map(x => "<code>" + visSafe(x.trim().slice(0, 34)) + "</code>")
               .join(" "));
      // A detailed task names the general step it serves. Without it the two
      // lanes read as two unrelated lists.
      if (n.kind === "experimenttask" && n.elaborates)
        L.push(visSafe(t('graph.card.elaborates') + " " + n.elaborates));
      if (n.kind === "experimenttask" && n.input && n.input.route)
        L.push("<code>" + visSafe(String(n.input.route).slice(0, 34)) + "</code>");
      if ((n.kind === "planstep" || n.kind === "experimenttask")
          && n.input && n.input.tools)
        L.push(String(n.input.tools).split(",").slice(0, 4)
               .map(x => "<code>" + visSafe(x.trim().slice(0, 34)) + "</code>")
               .join(" "));
      if (n.criterion)
        L.push(visSafe(t('graph.card.criterion') + " "
                       + firstSentence(n.criterion, 80)));
      else if (n.origin && n.origin.code !== "question")
        L.push("<i>" + visSafe(t('graph.origin.' + n.origin.code,
                                 { reason: n.origin.reason || "" })) + "</i>");
      if (n.chips && n.chips.length)
        L.push(n.chips.slice(0, 4)
               .map(c => "<code>" + visSafe(String(c.label || "").slice(0, 22)) + "</code>")
               .join(" "));
      const foot = [
        n.attachments && n.attachments.length
          ? t('graph.count.attached', { count: n.attachments.length }) : "",
        n.executor_agent ? shortAgent(n.executor_agent) : "",
        (n.provenance || []).length
          ? t('graph.count.calls', { count: n.provenance.length }) : "",
      ].filter(Boolean).join("  ·  ");
      if (foot) L.push("<i>" + visSafe(foot) + "</i>");
      return L.join("\n");
    }
    // Agents are shown by their Russian role name — the same table the main
    // window uses (status_indicator.js); runtime ids stay in the data.
    const shortAgent = a => (window.StatusIndicator && StatusIndicator.agentName)
      ? (StatusIndicator.agentName(a) || String(a)) : String(a).replace(/Agent$/, "");
    // The tooltip used to print the raw identifiers — "type: hypothesis · status:
    // under_verification" — while the card beside it said the same thing in the
    // reader's own words. Research nodes carry those words from the server.
    const titleOf = n => [
      t('graph.tooltip.type', { kind: RESEARCH_KINDS.has(n.kind) ? rTypeName(n) : (n.kind || "") }),
      n.executor_agent ? t('graph.tooltip.source', { agent: shortAgent(n.executor_agent) }) : "",
      t('graph.tooltip.status', { status: RESEARCH_KINDS.has(n.kind) ? rStatusWord(n) : (n.status || "") }),
      Array.isArray(n.calls) && n.calls.length ? t('graph.tooltip.toolCalls', { count: n.calls.length }) : "",
      n.why ? t('graph.why.title') + ": " + String(n.why).slice(0, 200) : "",
      n.output?String(n.output).slice(0,300):"" ].filter(Boolean).join("\n");

    // ── what is working right now ─────────────────────────────────────────────
    // An ACTION card pulses; everything else in flight is coloured and still.
    // The difference is the user's, and it is the right one: a plan step and an
    // experiment task are work somebody is doing this minute, while a
    // hypothesis under verification or an observation waiting to be weighed is
    // a state, not an activity. On a canvas of sixty cards a reader finds the
    // one that moves before they find the one that is merely yellow.
    const PULSING_KINDS = new Set(["planstep", "experimenttask"]);
    const PULSING_STATUS = new Set(["in_progress", "running"]);
    const isPulsing = n => PULSING_KINDS.has(n.kind) && PULSING_STATUS.has(n.status);
    //: Redraw rate while something is running. 20 is far below the 60 a plain
    //: rAF loop would ask for, and a pulse this slow does not need the rest.
    //: PULSE_CYCLE is the full breath in milliseconds — named as the period a
    //: reader can time, not as the 1/ω the sine actually takes, because the
    //: two differ by 2π and one of them is what somebody tuning this will mean.
    const PULSE_FPS = 20, PULSE_MS = 1000 / PULSE_FPS, PULSE_CYCLE = 1200;
    let pulsing = new Set(), pulseRunning = false, pulseLast = 0;

    //: Which cards are working, recomputed from the payload the server just
    //: sent. Held OUTSIDE the DataSet on purpose: `poll` rebuilds every node
    //: object wholesale every 1.5 s, so a colour an animation wrote into a node
    //: would be overwritten within the second — and each such write re-runs
    //: vis's html-label parser over agent-written text, the one code path in
    //: this file that can take the whole canvas down.
    function setPulsing(next){
      pulsing = next;
      if (pulsing.size && !pulseRunning) {
        pulseRunning = true;
        requestAnimationFrame(pulseLoop);
      }
    }
    function pulseLoop(ts){
      // …and it stops when there is nothing to say. `pulsing` is recomputed
      // only inside `poll`, so with the live feed switched off — or with every
      // poll throwing — nothing would ever empty the set, and the loop would
      // repaint the canvas twenty times a second for as long as the tab was
      // open, animating a study that is no longer being updated.
      const live = document.getElementById("auto");
      if (!pulsing.size || !network || (live && !live.checked)) {
        pulseRunning = false;
        return;
      }
      if (ts - pulseLast >= PULSE_MS) { pulseLast = ts; network.redraw(); }
      requestAnimationFrame(pulseLoop);
    }
    function roundPath(ctx, x, y, w, h, r){
      const k = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + k, y);
      ctx.arcTo(x + w, y, x + w, y + h, k);
      ctx.arcTo(x + w, y + h, x, y + h, k);
      ctx.arcTo(x, y + h, x, y, k);
      ctx.arcTo(x, y, x + w, y, k);
      ctx.closePath();
    }
    //: The halo itself, drawn UNDER the cards: `solid()` makes every card
    //: background fully opaque, so a ring painted before them can never touch
    //: the label — it reads as a glow escaping from behind the box, and the
    //: text it surrounds stays exactly as legible as it was.
    function drawPulse(ctx){
      if (!pulsing.size || !network) return;
      const phase = 0.5 + 0.5 * Math.sin(
        performance.now() * 2 * Math.PI / PULSE_CYCLE);
      ctx.save();
      ctx.strokeStyle = WARN;
      ctx.lineWidth = 3;
      pulsing.forEach(id => {
        let box = null;
        try { box = network.getBoundingBox(id); } catch (err) { return; }
        if (!box || box.right - box.left < 2 || box.bottom - box.top < 2) return;
        ctx.globalAlpha = 0.22 + 0.62 * phase;
        const pad = 4 + 5 * phase;
        roundPath(ctx, box.left - pad, box.top - pad,
                  box.right - box.left + pad * 2,
                  box.bottom - box.top + pad * 2, 13);
        ctx.stroke();
      });
      ctx.restore();
    }

    // ══════════════════════════════════════════════════════════════════════════
    const nodes = new vis.DataSet([]);
    const edges = new vis.DataSet([]);
    let network = null;
    // The research bands the canvas paints behind the cards, newest layout wins.
    let stageBands = [];
    function makeNetwork(){
      const r = isResearch();
      if (network) network.destroy();
      network = new vis.Network(document.getElementById("net"), { nodes, edges }, {
        nodes: { borderWidth: 2, shadow: { enabled: true, color: "rgba(0,0,0,0.35)", size: 10, x: 0, y: 3 } },
        edges: { arrows: { to: { scaleFactor: r ? 0.8 : 0.55 } },
                 color: { color: r ? "#94a3b8" : "#3a4150",
                          highlight: r ? "#ffffff" : "#64748b" },
                 font: { color: r ? "#cbd5e1" : "#8b93a1", size: r ? 13 : 10,
                         strokeWidth: r ? 5 : 0, strokeColor: "#14161a" },
                 // The research graph now reads top to bottom through its stage
                 // bands, so its links bend the way they travel; the log still
                 // runs along a clock, left to right.
                 smooth: { type: "cubicBezier",
                           forceDirection: r ? "vertical" : "horizontal",
                           roundness: r ? 0.45 : 0.35 } },
        // Neither view lets vis place anything. The log is a timeline: every
        // node already carries the x its start time earns and the row of the
        // agent that ran it. The research graph is banded by stage, and a band
        // is a fact about the study — hierarchical layout would collapse both
        // back into columns of its own choosing.
        layout: { hierarchical: false, randomSeed: 1 },
        physics: { enabled: false },
        interaction: { hover: true, tooltipDelay: 120, navigationButtons: false },
      });
      // The stretches the request went through, painted behind the cards.
      // A band is not a node: it says nothing a card does not already say, it
      // just says where one stretch ended and the next began, which is the
      // thing you otherwise reconstruct by reading every name in order.
      network.on("beforeDrawing", ctx => {
        if (isResearch()) { drawStageBands(ctx); return drawPulse(ctx); }
        if (!lastPhases.length) return;
        const ys = Object.values(nodeData)
          .map(n => n.y).filter(v => typeof v === "number");
        if (!ys.length) return;
        const top = Math.min(...ys) - 90, bottom = Math.max(...ys) + 90;
        ctx.save();
        lastPhases.forEach(b => {
          const pad = 20;
          ctx.fillStyle = PHASE_FILL[b.phase] || "rgba(148,163,184,0.06)";
          ctx.fillRect(b.x0 - pad, top, (b.x1 - b.x0) + pad * 2, bottom - top);
          ctx.strokeStyle = PHASE_EDGE[b.phase] || "rgba(148,163,184,0.25)";
          ctx.lineWidth = 1;
          ctx.strokeRect(b.x0 - pad, top, (b.x1 - b.x0) + pad * 2, bottom - top);
          ctx.fillStyle = PHASE_EDGE[b.phase] || "#94a3b8";
          ctx.font = "600 22px -apple-system, Segoe UI, sans-serif";
          ctx.textBaseline = "bottom";
          ctx.fillText(b.label, b.x0 - pad + 12, top + 34);
        });
        ctx.restore();
      });
      network.on("click", params => {
        if (!params.nodes.length) { closeDetail(); return; }
        selectedId = params.nodes[0];
        focusCallId = null; focusPending = false;
        lastDetailStamp = JSON.stringify(nodeData[selectedId]);
        showDetail(nodeData[selectedId]);
      });
    }

    // ── stage bands ───────────────────────────────────────────────────────────
    // A study is read down the page by the stage that produced each card — what
    // was asked, what was read, what was tested, what came out — and across a
    // band by the epistemic level, so the two readings do not fight: down is
    // the work, across is the argument.
    //
    // This replaces vis's hierarchical layout for the research view. Its levels
    // are an x index, so one layer is one column and a study that recorded
    // eighteen observations put all eighteen in a single column four thousand
    // pixels tall; the fit that followed dropped to 0.21, and vis stops drawing
    // a label once fontSize × scale falls under its scaling.label.drawThreshold
    // of 5 — the canvas showed eighteen empty boxes. Unlinked cards made it
    // worse still: with no edge to hang on, each is its own tree and vis stacks
    // the trees down the y axis, so the column came out as a diagonal.
    // A band with no STAGE_TINT entry does not fall back visibly — stageOf
    // below sends its cards to "hypotheses" instead, so the two tables must be
    // extended together or a whole stage silently disappears into another one.
    const STAGE_ORDER = ["framing", "literature", "hypotheses", "experiment", "report"];
    const STAGE_TINT = {
      framing:    { fill: "rgba(59,130,246,0.07)",  line: "rgba(59,130,246,0.42)" },
      literature: { fill: "rgba(56,189,248,0.07)",  line: "rgba(56,189,248,0.42)" },
      hypotheses: { fill: "rgba(139,92,246,0.07)",  line: "rgba(139,92,246,0.42)" },
      experiment: { fill: "rgba(249,115,22,0.07)",  line: "rgba(249,115,22,0.42)" },
      report:     { fill: "rgba(34,197,94,0.07)",   line: "rgba(34,197,94,0.42)" },
    };
    // The server names the stage; this is the fallback for a study archived
    // before it did, where the type is all there is to go on. Literature
    // evidence is indistinguishable from experimental evidence here — that
    // distinction lives in attrs.subtype, which the projection reads.
    const STAGE_BY_KIND = { framing: "framing", researchquestion: "framing",
      constraint: "framing", empiricalbase: "framing", resource: "framing",
      hypothesis: "hypotheses", confirmationcriteria: "hypotheses",
      verificationmethod: "experiment", tool: "experiment",
      evidence: "experiment", generateddata: "experiment", codeartifact: "experiment",
      conclusion: "report", outcome: "report", report: "report",
      publication: "report", efficiencyjustification: "report",
      costmodel: "report", efficiencymetric: "report" };
    const stageOf = n => {
      const s = n.stage || STAGE_BY_KIND[n.kind];
      return STAGE_TINT[s] ? s : "experiment";
    };
    // Nominal card pitch, used for the first pass and as the fallback when a
    // card has not been drawn yet and has no measured box.
    const LEVEL_SEPARATION = 400, NODE_PITCH = 240;
    // How wide a band runs before it wraps, and the breathing room around a
    // band's contents. Wide enough for six cards: past that the whole study
    // stops fitting a screen at a readable zoom.
    const BAND_WIDTH = 2160, BAND_PAD = 38, BAND_MIN_HEIGHT = 128;

    // ── the stage rail ────────────────────────────────────────────────────────
    // The stage names used to be painted INSIDE each band, at its top-left
    // corner. That is exactly where the plan column then put its first card, so
    // the one thing a reader needs in order to know which stage they are
    // looking at was the one thing a card was guaranteed to cover: on a real
    // study three of the five names were unreadable. The names now live in a
    // rail of their own, left of every card in either track, and nothing is
    // ever seated in it — so this cannot come back by rearrangement.
    const PLAN_LANE_TITLE = ['graph.plan.title', 'graph.plan.experiments'];
    const RAIL_GAP = 30, RAIL_MIN = 140;
    const STAGE_FONT = "600 26px -apple-system, Segoe UI, sans-serif";
    const STAGE_NOTE_FONT = "400 18px -apple-system, Segoe UI, sans-serif";
    //: Measured off an offscreen context rather than assumed, because the
    //: widest name is a translation: "Анализ литературы" is half again as wide
    //: as "Hypotheses", and a rail sized for one clips the other.
    let railMeasure;
    function railWidth(){
      if (railMeasure === undefined) {
        try { railMeasure = document.createElement("canvas").getContext("2d"); }
        catch (err) { railMeasure = null; }
      }
      if (!railMeasure) return 260;
      let w = RAIL_MIN;
      railMeasure.font = STAGE_FONT;
      STAGE_ORDER.forEach(s => {
        w = Math.max(w, railMeasure.measureText(t('graph.stage.' + s, s)).width);
      });
      railMeasure.font = STAGE_NOTE_FONT;
      w = Math.max(w, railMeasure.measureText(t('graph.stage.empty')).width);
      return Math.ceil(w) + RAIL_GAP;
    }

    // The four stages, painted behind the cards as the rows of one page. A band
    // with nothing in it is still drawn: an empty "report" row says the study
    // has not got there yet, which is the question a reader opens the graph
    // with, and leaving it out made a study that had barely started look
    // finished.
    function drawStageBands(ctx){
      if (!stageBands.length) return;
      ctx.save();
      stageBands.forEach(b => {
        const tint = STAGE_TINT[b.stage] || { fill: "rgba(148,163,184,0.05)",
                                              line: "rgba(148,163,184,0.25)" };
        const w = b.right - b.left, h = b.bottom - b.top;
        ctx.fillStyle = b.count ? tint.fill : "rgba(148,163,184,0.03)";
        ctx.fillRect(b.left, b.top, w, h);
        ctx.strokeStyle = tint.line;
        ctx.lineWidth = 1;
        // A stage nobody has reached is outlined, not filled — the row is
        // there, the work is not.
        if (!b.count) ctx.setLineDash([7, 6]);
        ctx.strokeRect(b.left, b.top, w, h);
        ctx.setLineDash([]);
        // The plan column's own edge, so the reader sees two tracks rather
        // than one wide band: the intention on the left, the record on the
        // right, sharing the level.
        if (b.planRight != null) {
          ctx.strokeStyle = "rgba(148,163,184,0.30)";
          ctx.setLineDash([3, 5]);
          ctx.beginPath();
          ctx.moveTo(b.planRight + BAND_PAD / 2, b.top);
          ctx.lineTo(b.planRight + BAND_PAD / 2, b.bottom);
          ctx.stroke();
          ctx.setLineDash([]);
        }
        // In the rail: right-aligned against the band's edge and centred on
        // the band, so it reads as the label of the row whatever the row holds.
        const name = t('graph.stage.' + b.stage, b.stage);
        const railX = b.left - RAIL_GAP, mid = (b.top + b.bottom) / 2;
        ctx.textAlign = "right";
        ctx.fillStyle = tint.line;
        ctx.font = STAGE_FONT;
        if (b.count) {
          ctx.textBaseline = "middle";
          ctx.fillText(name, railX, mid);
        } else {
          // Two lines for a stage nobody has reached: the name, and what the
          // empty row means.
          ctx.textBaseline = "bottom";
          ctx.fillText(name, railX, mid - 3);
          ctx.font = STAGE_NOTE_FONT;
          ctx.fillStyle = "rgba(148,163,184,0.55)";
          ctx.textBaseline = "top";
          ctx.fillText(t('graph.stage.empty'), railX, mid + 5);
        }
        ctx.textAlign = "left";
      });
      // A heading per lane that has anything in it, so the reader is told
      // which plan each column is: the study's general steps, and the
      // experiment module's detailed tasks under them.
      const withPlan = stageBands.filter(b => b.planRight != null);
      if (withPlan.length && Array.isArray(withPlan[0].planLanes)) {
        const top = Math.min.apply(null, withPlan.map(b => b.top));
        ctx.fillStyle = "rgba(148,163,184,0.75)";
        ctx.font = "600 22px -apple-system, Segoe UI, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        withPlan[0].planLanes.forEach((lane, i) => {
          if (!lane) return;
          ctx.fillText(t(PLAN_LANE_TITLE[i], PLAN_LANE_TITLE[i]),
                       (lane.left + lane.right) / 2, top - 12);
        });
        ctx.textAlign = "left";
      }
      ctx.restore();
    }

    // ── layered placement ─────────────────────────────────────────────────────
    // Flowing the cards row by row put every card in the right band but in an
    // arbitrary order inside it, and that is what made the hogweed graph hard
    // to follow: the evidence a method produced sat six cards away with three
    // unrelated methods between them, and the link cut across all of them.
    // Ordering within a band to keep connected cards adjacent is the one thing
    // a layered engine does that a flow cannot, so the order is ELK's now
    // (elkjs 0.12, layered — Sugiyama): `elk.partitioning` pins each card to
    // its stage, and ELK is free to arrange inside it.
    //
    // ELK computes COORDINATES ONLY. Its POLYLINE bend points go unused —
    // vis-network draws an edge as one curve between two anchors and accepts no
    // waypoints — so crossings go away through placement, not routing.
    const ELK_OPTS = {
      "elk.algorithm": "layered",
      "elk.direction": "DOWN",
      "elk.partitioning.activate": "true",
      "elk.edgeRouting": "POLYLINE",
      "elk.layered.spacing.nodeNodeBetweenLayers": "96",
      "elk.spacing.nodeNode": "34",
      "elk.spacing.edgeNode": "26",
      // Ties broken by the order the projection emitted — which is the order
      // the study recorded things in — so re-opening a finished study does not
      // reshuffle it.
      "elk.layered.considerModelOrder.strategy": "NODES_AND_EDGES",
    };
    let elk = null;
    try { elk = new ELK(); } catch (err) { console.warn("ELK unavailable", err); }

    // Coordinates for the cards vis has drawn, or null if the engine could not
    // be asked. Sizes are the measured boxes: a layered layout that guesses the
    // card widths packs the rows wrong.
    async function elkBoxes(place, sizeOf, edgeList){
      if (!elk) return null;
      const ids = Object.keys(place).filter(
        id => nodes.get(id) && place[id].track !== "plan");
      if (!ids.length) return null;
      const children = ids.map(id => {
        const size = sizeOf(id);
        return { id: id, width: size.w, height: size.h,
                 layoutOptions: { "elk.partitioning.partition":
                                    String(STAGE_ORDER.indexOf(place[id].stage)) } };
      });
      const live = {};
      ids.forEach(id => { live[id] = true; });
      // Edges that run UP the page are handed to ELK the other way round.
      // The graph is cyclic as recorded — a question motivates a hypothesis
      // downward while the evidence it produced relates back up to the question
      // — and a layered engine breaks a cycle by reversing an edge of its own
      // choosing, which on this study put the evidence and the method that
      // produced it on opposite sides of the band. The partitions already fix
      // which layer each card lands in, so an upward edge carries no layering
      // information: all it can still say is which two cards want to be near
      // each other, and it says that in either direction. vis draws the real
      // arrow from the real edge, so nothing about the record changes.
      const rank = id => STAGE_ORDER.indexOf(place[id].stage);
      const elkEdges = [];
      (edgeList || []).forEach((e, i) => {
        if (!e || !live[e.src] || !live[e.dst] || e.src === e.dst) return;
        const up = rank(e.dst) < rank(e.src);
        elkEdges.push({ id: "le" + i,
                        sources: [up ? e.dst : e.src],
                        targets: [up ? e.src : e.dst] });
      });
      const laid = await elk.layout({ id: "root", layoutOptions: ELK_OPTS,
                                      children: children, edges: elkEdges });
      const box = {};
      (laid.children || []).forEach(c => {
        if (typeof c.x === "number" && typeof c.y === "number") box[c.id] = c;
      });
      return Object.keys(box).length ? box : null;
    }

    // ELK leaves no room for a stage nobody has reached — it has no nodes there
    // to space out — and an empty "report" row is the answer to "how far has
    // this got". So the bands are re-stacked afterwards: each stage keeps the
    // geometry ELK gave it and moves as one block, and an empty stage gets a
    // strip of its own. Translating a stage uniformly cannot introduce a
    // crossing: it preserves both the order within the band and the order of
    // the bands.
    function stackBands(place, box){
      const extent = {};
      Object.keys(box).forEach(id => {
        const c = box[id], stage = place[id].stage;
        const e = extent[stage] ||
                  (extent[stage] = { top: Infinity, bottom: -Infinity, count: 0 });
        e.top = Math.min(e.top, c.y);
        e.bottom = Math.max(e.bottom, c.y + c.height);
        e.count += 1;
      });
      // What the plan needs of each band, BEFORE the bands are sized — see
      // planBlocks. A band too short for its own steps pushed them into the
      // band above and the band below.
      const blocks = planBlocks(place);
      const shift = {}, bands = [];
      let cursor = 0;
      STAGE_ORDER.forEach(stage => {
        const e = extent[stage];
        const recordH = e ? e.bottom - e.top : 0;
        const planH = blocks[stage] ? blocks[stage].height : 0;
        const inner = Math.max(BAND_MIN_HEIGHT, recordH, planH);
        const height = inner + BAND_PAD * 2;
        // Both blocks are centred in the band. Top-aligning the record left a
        // hole under it whenever the band had grown for the plan's sake.
        if (e) shift[stage] = cursor + BAND_PAD + (inner - recordH) / 2 - e.top;
        bands.push({ stage: stage, top: cursor, bottom: cursor + height,
                     count: e ? e.count : 0 });
        cursor += height;
      });
      const seats = {};
      let x0 = Infinity, x1 = -Infinity;
      Object.keys(box).forEach(id => {
        const c = box[id];
        seats[id] = { x: c.x + c.width / 2,
                      y: c.y + c.height / 2 + shift[place[id].stage] };
        x0 = Math.min(x0, c.x);
        x1 = Math.max(x1, c.x + c.width);
      });
      bands.forEach(b => { b.left = x0 - BAND_PAD; b.right = x1 + BAND_PAD; });
      // The plan goes in beside the finished bands, at each step's own level,
      // and the bands are then widened to run behind the column: the tint is
      // what makes "this step belongs to the literature stage" unambiguous
      // rather than a guess from vertical position.
      const plan = planColumn(bands, x0 - BAND_PAD, blocks);
      if (plan.used) {
        Object.keys(plan.seats).forEach(id => { seats[id] = plan.seats[id]; });
        bands.forEach(b => { b.left = plan.left - BAND_PAD; b.planRight = plan.right;
                             b.planLanes = plan.lanes; });
      }
      addRail(bands);
      return { seats: seats, bands: bands };
    }

    // Where the rail starts. Kept on the band so frameStudy can open the camera
    // wide enough to show it: a name the reader has to pan to find is no better
    // than a name a card sits on.
    function addRail(bands){
      const rail = railWidth();
      bands.forEach(b => { b.railLeft = b.left - rail; });
    }

    // ── the plan column ───────────────────────────────────────────────────────
    // The plan is a parallel track, not part of the argument, so it is drawn in
    // its own column beside the bands rather than as cards inside them. A step
    // sits at the height of the stage it asks for, so the reader can see the
    // intention and the record of it on one line: "collect the literature" next
    // to the literature that was collected.
    //
    // Kept out of the layout engine entirely. Feeding the steps to ELK put them
    // in the band flow, which is exactly the conflation this separation exists
    // to undo — and the `realises` links would then drag the record's cards
    // toward the plan instead of ordering them by the argument.
    const PLAN_GAP = 72, PLAN_ROW_GAP = 16;

    // What the plan track needs of each band, measured before the bands are
    // sized. Getting this order wrong is the defect the operator hit: the plan
    // used to be centred in whatever height the RECORD happened to need, and
    // allowed to overflow. A study with four steps and two cards — which is
    // every study in its first minutes — then pushed its steps clean out of
    // their own band, so "collect the literature" was drawn under the heading
    // «Постановка» and two steps from different stages landed on top of each
    // other. A step drawn outside its band is worse than a step drawn small:
    // the column exists to say which stage the plan asked for, and outside its
    // band it says the wrong one.
    //: The plan track reads left to right by GRAIN: the general step the outer
    //: planner wrote, then the detailed task the experiment module designed
    //: under it, then the record. Two intentions at different grains must not
    //: share a column — stacked together a reader cannot tell which plan a
    //: card came from, which is the whole reason the two types exist.
    //: `lane` comes from the server (store._PLAN_LANE); 0 when it says nothing,
    //: so a study recorded before lanes existed still draws.
    const PLAN_LANES = 2;
    function planBlocks(place){
      const blocks = {};
      Object.keys(place).forEach(id => {
        if (place[id].track !== "plan" || !nodes.get(id)) return;
        const stage = place[id].stage;
        const lane = Math.max(0, Math.min(PLAN_LANES - 1, place[id].lane || 0));
        const byStage = blocks[stage] = blocks[stage] || { lanes: [], height: 0 };
        (byStage.lanes[lane] = byStage.lanes[lane] || { ids: [], height: 0 })
          .ids.push(id);
      });
      Object.keys(blocks).forEach(stage => {
        const byStage = blocks[stage];
        byStage.lanes.forEach(lane => {
          if (!lane) return;
          lane.ids.sort((a, b) => (place[a].order || 0) - (place[b].order || 0)
                                || String(a).localeCompare(String(b)));
          lane.height = lane.ids.reduce((s, id) => s + measuredSize(id).h, 0)
                      + PLAN_ROW_GAP * (lane.ids.length - 1);
          // The band has to hold the FULLEST lane, not their sum.
          byStage.height = Math.max(byStage.height, lane.height);
        });
      });
      return blocks;
    }

    function planColumn(bands, leftEdge, blocks){
      const stages = Object.keys(blocks);
      if (!stages.length)
        return { seats: {}, right: leftEdge, left: leftEdge, lanes: [],
                 used: false };
      // One axis per lane, each sized by the widest card in THAT lane, so a
      // lane of short cards does not leave a hole beside a lane of long ones.
      // The rightmost lane's widest card ends exactly at `right`, clearing the
      // record track by PLAN_GAP.
      const widest = [];
      for (let lane = 0; lane < PLAN_LANES; lane++) {
        let w = 0;
        stages.forEach(s => ((blocks[s].lanes[lane] || {}).ids || [])
          .forEach(id => { w = Math.max(w, measuredSize(id).w); }));
        widest[lane] = w;
      }
      const right = leftEdge - PLAN_GAP;
      // Laid out from the right edge backwards, so the detailed lane sits
      // against the record it produced and the general one outside it.
      const axis = [];
      let edge = right;
      for (let lane = PLAN_LANES - 1; lane >= 0; lane--) {
        if (!widest[lane]) { axis[lane] = edge; continue; }
        axis[lane] = edge - widest[lane] / 2;
        edge -= widest[lane] + PLAN_GAP;
      }
      const seats = {};
      bands.forEach(band => {
        const byStage = blocks[band.stage];
        if (!byStage) return;
        const mid = (band.top + band.bottom) / 2;
        byStage.lanes.forEach((lane, i) => {
          if (!lane) return;
          // Each lane centred independently in a band that was sized to hold
          // the fullest of them, so no lane can overflow.
          let y = mid - lane.height / 2;
          lane.ids.forEach(id => {
            seats[id] = { x: axis[i], y: y + measuredSize(id).h / 2 };
            y += measuredSize(id).h + PLAN_ROW_GAP;
          });
        });
      });
      const lanes = axis.map((x, i) => widest[i]
        ? { left: x - widest[i] / 2, right: x + widest[i] / 2 } : null);
      const far = Math.min.apply(null,
        lanes.filter(Boolean).map(l => l.left).concat([right]));
      return { seats: seats, right: right, left: far, lanes: lanes, used: true };
    }

    // First pass, on nominal sizes: vis reports a real box only once it has
    // drawn a card, and it cannot draw one without a position.
    function layoutStages(list){
      const place = {};
      const byStage = new Map(STAGE_ORDER.map(s => [s, []]));
      list.forEach(n => byStage.get(stageOf(n)).push(n));
      const perRow = Math.max(1, Math.floor(BAND_WIDTH / LEVEL_SEPARATION));
      let y = 0;
      STAGE_ORDER.forEach(stage => {
        // Inside a band the epistemic level orders the cards, then the index —
        // question before hypothesis before method before observation.
        const group = byStage.get(stage).sort((a, b) =>
          ((a.level ?? 3) - (b.level ?? 3))
          || ((a.index || 0) - (b.index || 0))
          || String(a.id).localeCompare(String(b.id)));
        group.forEach((n, i) => {
          place[n.id] = { stage, order: i, track: n.track || "record",
                          lane: n.lane || 0,
                          x: (i % perRow) * LEVEL_SEPARATION,
                          y: y + BAND_PAD + Math.floor(i / perRow) * NODE_PITCH };
        });
        y += Math.max(BAND_MIN_HEIGHT,
                      Math.ceil(group.length / perRow) * NODE_PITCH + BAND_PAD * 2);
      });
      return place;
    }

    // ── the research node card ────────────────────────────────────────────────
    function researchNode(n, place){
      const st = rStatus(n.status);
      const c = R_KIND[n.kind] || st.c;
      const slot = place && place[n.id];
      const node = {
        id: n.id, title: titleOf(n), shape: "box", label: researchLabel(n),
        color: { background: solid(c, 0.14), border: c,
                 highlight: { background: solid(c, 0.22), border: c },
                 // Without an explicit hover vis falls back to its OWN default
                 // (#D2E5FF) and leaves the label at --ink #e8eaed: 1.07:1
                 // contrast, so the card went blank under the cursor and read as
                 // if the node had vanished.
                 hover: { background: solid(c, 0.26), border: c } },
        font: { color: INK, size: 16, multi: "html",
                face: "-apple-system, Segoe UI, sans-serif", align: "left",
                // mod "bold" rather than the default "bold italic": the status
                // word is set in the same weight as the type it follows, and
                // only its colour differs.
                boldital: { color: statusInk(n.status), size: 16, mod: "bold",
                            face: "-apple-system, Segoe UI, sans-serif" } },
        // Hovering must not re-typeset the label: labelHighlightBold redraws it
        // bold, which re-runs the parser over the very string that can throw.
        chosen: { node: true, label: false },
        borderWidth: n.virtual ? 1 : 2, shapeProperties: { borderRadius: 9 },
        widthConstraint: { minimum: 230, maximum: 340 }, margin: 12,
      };
      if (n.virtual) node.shapeProperties.borderDashes = [4, 3];
      // Every research card is pinned: the band it sits in is a fact about the
      // study, not something a layout engine may optimise away.
      if (slot) {
        const seat = pinned[n.id] || slot;
        node.x = seat.x; node.y = seat.y;
        node.fixed = { x: true, y: true };
      }
      return node;
    }

    const CARD_GAP = 28;
    //: `laying` holds the layout currently in flight, so a second poll can WAIT
    //: on it instead of being told nothing changed. Without it, a poll arriving
    //: while ELK was still working framed the study against the nominal
    //: first-pass grid and latched `fitted`, and the real layout that landed a
    //: moment later was never framed — the reader got a camera pointed at blank
    //: canvas beside the study. The synchronous version could not lose this way.
    let pinned = {}, pinnedFor = "", laying = null;
    //: Which study the layout belongs to. ELK resolves a task boundary or more
    //: after the call, so a reader can switch studies mid-layout; `hardReset`
    //: bumps this, and a layout that comes back for a study nobody is looking
    //: at writes nothing. Without it the abandoned run wrote its bands and its
    //: seats over the new study and vis's `update` RE-ADDED every one of its
    //: cards, because update() inserts what the set does not hold.
    let studyGen = 0;
    function measuredSize(id){
      try {
        const box = network.getBoundingBox(id);
        // A card vis has not drawn yet reports {0,0,0,0} rather than nothing,
        // and a zero-height card makes a column stack every one of its cards at
        // the same point. A degenerate box is not a measurement.
        if (box && box.right - box.left > 1 && box.bottom - box.top > 1)
          return { w: box.right - box.left, h: box.bottom - box.top };
      } catch (err) { /* not drawn yet */ }
      return { w: LEVEL_SEPARATION - CARD_GAP, h: NODE_PITCH - CARD_GAP };
    }

    // Second pass, on the boxes vis measured: ask ELK where the cards go, and
    // flow them by hand if it cannot answer. The fallback is not decoration —
    // a 1.6MB script that fails to load must cost the study its ordering, not
    // its drawing.
    function reflowStages(place, signature, edgeList){
      if (!place) return Promise.resolve(false);
      // Same study state as the layout already running or already done: hand
      // back that run's promise if it is still going, so the caller waits for
      // the real coordinates rather than framing the first-pass grid.
      if (pinnedFor === signature) return laying || Promise.resolve(false);
      // Claimed BEFORE the await: ELK is asynchronous and a poll arrives every
      // second, so two layouts of the same study would otherwise race and the
      // loser would move every card again under the reader's cursor.
      pinnedFor = signature;
      laying = layOutStudy(place, edgeList);
      laying.then(() => { laying = null; }, () => { laying = null; });
      return laying;
    }

    async function layOutStudy(place, edgeList){
      const gen = studyGen;
      let laid = null;
      try {
        const box = await elkBoxes(place, measuredSize, edgeList);
        if (box) laid = stackBands(place, box);
      } catch (err) {
        console.warn("ELK layout failed; flowing the bands instead", err);
      }
      // Checked AFTER the await and before any write: this is the whole point
      // of the token. `pinnedFor` is left alone — hardReset already cleared it
      // for the new study, and writing to it here would clobber that.
      if (gen !== studyGen) return false;
      try {
        if (!laid) laid = flowSeats(place, measuredSize);
        if (!laid) { pinnedFor = ""; return false; }
        stageBands = laid.bands;
        pinned = laid.seats;
        nodes.update(Object.keys(laid.seats).map(id => ({ id: id, ...laid.seats[id] })));
        routeEdges(laid.seats);
        return true;
      } catch (err) {
        // The signature was claimed before the await, so a throw from here on
        // would pin this graph state forever and the study would never be laid
        // out again. Release the claim and let the next poll try.
        console.warn("laying out the study failed", err);
        pinnedFor = "";
        return false;
      }
    }

    // The fallback ordering, used when ELK is unavailable. Each band flows its
    // own cards left to right, wraps at BAND_WIDTH, and the next band starts
    // under the deepest row of this one. Right band, arbitrary order.
    // With the cards finally placed, every link is checked against the cards it
