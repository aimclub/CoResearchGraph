    // would run over. This is the complaint the layout engine alone does not
    // answer: a hypothesis sits one band above its methods and the evidence one
    // row below them, so the link from that evidence back up to the hypothesis
    // has the whole row of methods in its way, and both cards are in bands that
    // look adjacent. vis draws an edge as one curve between two anchors and
    // takes no waypoints, so such a link cannot be routed AROUND a card — but
    // it can be bowed past it, and it is bowed outwards, away from the crowded
    // middle of the study.
    //: edge id -> the `smooth` setting the geometry asked for. Re-applied by
    //: the edge build on every poll, which would otherwise overwrite it.
    let routed = {};
    //: How far a bowed link may swing off its straight line, in canvas pixels.
    //: About two thirds of a card: enough to get past one, not enough to leave
    //: the neighbourhood.
    const MAX_BOW = 220;
    function routeEdges(seats){
      routed = {};
      const boxes = Object.keys(seats).map(id => {
        const size = measuredSize(id), seat = seats[id];
        return { id: id, left: seat.x - size.w / 2, right: seat.x + size.w / 2,
                 top: seat.y - size.h / 2, bottom: seat.y + size.h / 2 };
      });
      let centre = 0;
      boxes.forEach(b => { centre += (b.left + b.right) / 2; });
      centre = boxes.length ? centre / boxes.length : 0;
      // Sampled rather than solved: a card is at least 230 wide and about a
      // hundred tall, so a step of twenty pixels cannot slip past one, and the
      // exact intersection point is of no interest here.
      const runsOver = (a, b, box) => {
        const steps = Math.max(12, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 20));
        for (let k = 1; k < steps; k++) {
          const x = a.x + (b.x - a.x) * k / steps;
          const y = a.y + (b.y - a.y) * k / steps;
          if (x >= box.left && x <= box.right && y >= box.top && y <= box.bottom)
            return true;
        }
        return false;
      };
      const updates = [];
      edges.get().forEach(e => {
        const a = seats[e.from], b = seats[e.to];
        if (!a || !b) return;
        if (e.from === e.to) {
          routed[e.id] = { type: "curvedCW", roundness: 0.6 };
          updates.push({ id: e.id, smooth: routed[e.id] });
          return;
        }
        const blocked = boxes.some(box =>
          box.id !== e.from && box.id !== e.to && runsOver(a, b, box));
        let smooth;
        if (blocked) {
          const mid = (a.x + b.x) / 2;
          // vis swings the curve sideways by roughly `roundness` × the span, so
          // the bow is budgeted in PIXELS and the roundness derived from it. A
          // long link gets a gentle bend that clears the card next to it; a
          // fixed fraction sent it looping through a band it has no business in.
          const span = Math.hypot(b.x - a.x, b.y - a.y) || 1;
          smooth = { type: mid < centre ? "curvedCCW" : "curvedCW",
                     roundness: Math.max(0.12, Math.min(0.55, MAX_BOW / span)) };
        } else {
          smooth = Math.abs(a.y - b.y) < 8
            ? { type: "curvedCW", roundness: 0.22 } : false;
        }
        routed[e.id] = smooth;
        updates.push({ id: e.id, smooth: smooth });
      });
      if (updates.length) edges.update(updates);
    }

    function flowSeats(place, sizeOf){
      const byStage = new Map(STAGE_ORDER.map(s => [s, []]));
      Object.keys(place).forEach(id => {
        if (nodes.get(id) && place[id].track !== "plan")
          byStage.get(place[id].stage).push(id);
      });
      const seats = {}, bands = [], blocks = planBlocks(place);
      // The bands hug the widest row there actually is, not the wrap width: a
      // study of six cards drawn inside 2160px of band ran the rows off the
      // side of the screen with nothing in them.
      let y = 0, widest = 0;
      STAGE_ORDER.forEach(stage => {
        const ids = byStage.get(stage)
          .sort((a, b) => place[a].order - place[b].order);
        const top = y;
        // Flowed from a local origin, then moved as one block, so the record
        // can be centred in a band that grew to fit the plan beside it.
        const local = {};
        let x = 0, rowTop = 0, rowHeight = 0, reach = 0;
        ids.forEach(id => {
          const { w, h } = sizeOf(id);
          if (x > 0 && x + w > BAND_WIDTH) {        // wrap within the band
            x = 0; rowTop += rowHeight + CARD_GAP; rowHeight = 0;
          }
          local[id] = { x: x + w / 2, y: rowTop + h / 2 };
          x += w + CARD_GAP;
          reach = Math.max(reach, x - CARD_GAP);
          rowHeight = Math.max(rowHeight, h);
        });
        const recordH = ids.length ? rowTop + rowHeight : 0;
        const planH = blocks[stage] ? blocks[stage].height : 0;
        const inner = Math.max(BAND_MIN_HEIGHT, recordH, planH);
        const height = inner + BAND_PAD * 2;
        const offset = top + BAND_PAD + (inner - recordH) / 2;
        ids.forEach(id => {
          seats[id] = { x: local[id].x, y: local[id].y + offset };
        });
        widest = Math.max(widest, reach);
        bands.push({ stage, top, bottom: top + height, count: ids.length });
        y = top + height;
      });
      // One width for every band, so they read as stacked rows of one page
      // rather than four unrelated boxes. At least one card wide even with
      // nothing in the record track yet, or the five bands come out as slivers
      // beside the plan.
      widest = Math.max(widest, LEVEL_SEPARATION - CARD_GAP);
      bands.forEach(b => { b.left = -BAND_PAD; b.right = widest + BAND_PAD; });
      const plan = planColumn(bands, -BAND_PAD, blocks);
      if (plan.used) {
        Object.keys(plan.seats).forEach(id => { seats[id] = plan.seats[id]; });
        bands.forEach(b => { b.left = plan.left - BAND_PAD; b.planRight = plan.right;
                             b.planLanes = plan.lanes; });
      }
      addRail(bands);
      return { seats: seats, bands: bands };
    }

    // ══════════════════════════════════════════════════════════════════════════
    const nodeData = {};
    let lastGraph = { nodes: [], edges: [] };
    let fitted = false;
    // At most one request per selected study/view. A reset increments
    // `studyGen`, allowing the new selection to load immediately while the old
    // request drains; its late answer is ignored below.
    let pollInFlightFor = null;
    async function poll(){
      const pollGeneration = studyGen;
      if (pollInFlightFor === pollGeneration) return;
      pollInFlightFor = pollGeneration;
      try {
        const params = new URLSearchParams(location.search);
        const userId = params.get("user_id") || "";
        const sessionId = params.get("session_id") || "";
        if (!userId || !sessionId) {
          throw new Error(t('graph.noSession'));
        }
        // The same picker serves both views: a request in the log, a study in
        // the research graph. Its value is cleared on a view change, so one
        // view's selection can never be sent to the other.
        const chosenTurn = document.getElementById("turn").value;
        const url = `/api/users/${encodeURIComponent(userId)}/sessions/${encodeURIComponent(sessionId)}`
          + `/graph?view=${encodeURIComponent(document.getElementById("view").value)}`
          + (chosenTurn ? `&turn=${encodeURIComponent(chosenTurn)}` : "");
        const r = await fetch(url, { cache: "no-store" });
        if (!r.ok) throw new Error(t('graph.error.http', { status: r.status }));
        const g = await r.json();
        if (pollGeneration !== studyGen) return;
        lastGraph = g;
        // The API answers ANY failure with HTTP 200 and {"nodes": [], "edges":
        // [], "error": "..."} so it never breaks the page. Unread, that is
        // indistinguishable from a study nobody has written to yet.
        if (g.error) throw new Error(t('graph.error.server', { error: g.error }));
        const research = isResearch();
        lastPhases = research ? [] : (g.phases || []);
        // Node reports belong to the research graph; the execution log has the
        // agent summaries instead, and they have their own button.
        const autoWrap = document.getElementById("autoReportWrap");
        if (autoWrap) {
          autoWrap.style.display = research ? "" : "none";
          document.getElementById("autoReport").checked = autoNodeReports();
        }
        // The log is drawn one request at a time; the payload lists the rest.
        const turnWrap = document.getElementById("turnWrap"),
              turnSel = document.getElementById("turn"),
              turnLabel = document.getElementById("turnLabel");
        const choices = research
          ? (g.studies || []).map(x => ({
              id: x.study_id,
              text: (x.live ? t('graph.choice.live') + " · " : t('graph.choice.archived') + " · ")
                    + (x.label || t('graph.choice.study'))
                    + ` (${x.node_count})` }))
          : (g.turns || []).map((turn, i) => ({
              id: turn.turn_id, text: `${i + 1}. ${turn.prompt || t('graph.turn.request')}` }));
        const current = research ? g.study_id : g.turn_id;
        if (choices.length) {
          turnWrap.style.display = "";
          turnLabel.textContent = research ? t('graph.turn.study') : t('graph.turn.request');
          const want = choices.map(c => c.id).join("|");
          if (turnSel.dataset.keys !== want) {
            turnSel.dataset.keys = want;
            turnSel.innerHTML = choices.map(c =>
              `<option value="${esc(c.id)}">${esc(String(c.text).slice(0, 64))}</option>`
            ).join("");
          }
          if (current) turnSel.value = current;
        } else { turnWrap.style.display = "none"; }
        // What gets drawn is the SERVER's decision now. The client used to hold
        // its own allow-list of node kinds and drop the rest — and with them
        // every edge that touched one. In a real session the whole structure of
        // the research graph hung off dataset nodes that were not on that list,
        // so 100% of the edges were discarded and the canvas drew a field of
        // unconnected cards. The store folds those into the card they belong to
        // instead, and re-points their edges, so nothing is lost either way.
        // Depth in the execution tree. Set explicitly rather than inferred from
        // the arrows: an agent node is shared by every turn that called it, so
        // inference would drag it to whatever depth the first caller had and
        // bend the tree around it. Siblings are inserted in start order, which
        // is how vis lays them out left to right, so reading across a level
        // reads forward in time.
        // Already ordered by (level, start time) upstream; siblings enter in the
        // order they ran, which is the order vis lays them out.
        const ordered = g.nodes || [];
        // Decided once for the whole payload: placing a card needs to see how
        // many others share its band, which a per-node call cannot.
        const place = research ? layoutStages(ordered) : null;
        // One update call per poll, not one per node: physics is off, so every
        // single update() drags a full hierarchical re-layout and a synchronous
        // redraw behind it.
        const batchNodes = [], batchEdges = [];
        const liveNodes = new Set(), liveEdges = new Set();
        const working = new Set();
        ordered.forEach(n => {
          try {
          nodeData[n.id] = n; liveNodes.add(n.id);
          if (research) {
            batchNodes.push(researchNode(n, place));
            if (isPulsing(n)) working.add(n.id);
          } else {
            // Cards, sized by what they are: the request opens the row, agents
            // carry it, calls are the detail. Status is the border, identity the
            // fill, so a failed call is visible without reading its label.
            const isRoot = n.kind === "system";
            const isAgent = n.kind === "agent" || n.kind === "agent_call";
            const isGoal = n.kind === "goal", isResult = n.kind === "result";
            const c = colorOf(n);
            const node = { id:n.id, title:titleOf(n), label:labelOf(n), shape:shapeOf(n),
              margin: { top:9, bottom:9, left:12, right:12 },
              // Fixed, and the same number the server packs lanes with
              // (projection._CARD_WIDTH). If the two disagree the cards overlap.
              widthConstraint: { minimum: (n.card_width || 190) - 26,
                                 maximum: (n.card_width || 190) - 26 },
              color:{ background: solid(c, isGoal || isResult ? 0.22 : 0.16),
                      border: borderOf(n) === "#20232a" ? c : borderOf(n),
                      highlight: { background: solid(c, 0.32), border: c },
                      // Same default-hover trap as the research card: without
                      // this the box turns pale blue under a near-white label.
                      hover: { background: solid(c, 0.30), border: c } },
              borderWidth: 2,
              chosen: { node: true, label: false },
              font:{ color:"#e8eaed", multi:false, align:"left",
                     size: isGoal?17:(isAgent?16:13), strokeWidth:0 } };
            // Position comes from the server: x from when the call started, y
            // from whose lane it belongs to. Pinned, so the picture stays put
            // while it is being read and stretches as the run goes on.
            if (n.x != null && n.y != null) {
              node.x = n.x; node.y = n.y;
              node.fixed = { x: true, y: true };
            }
            if (isGoal) { node.borderWidth = 3; node.font.color = "#ffffff"; }
            else if (isRoot) { node.borderWidth = 3; node.color.border = "#38bdf8"; }
            batchNodes.push(node);
          }
          } catch (err) {
            // One card must never cost the drawing. Put it up under its own id
            // so the reader can still see and click the node, and say what
            // happened in its tooltip.
            console.warn("graph node", n && n.id, err);
            try {
              liveNodes.add(n.id);
              batchNodes.push({ id: n.id, label: String(n.id), shape: "box",
                                title: String(err && err.message || err) });
            } catch (ignored) { /* the id itself was unusable */ }
          }
        });
        // Only redraw the panel when the node it shows has actually changed.
        // It was rebuilt on every poll, which threw away the scroll position:
        // reading down a long tool result, the box snapped back to the top
        // every 1.5 seconds.
        if (selectedId && nodeData[selectedId]) {
          const stamp = JSON.stringify(nodeData[selectedId]);
          if (stamp !== lastDetailStamp) {
            lastDetailStamp = stamp;
            showDetail(nodeData[selectedId]);
          }
        }
        //: How many links each pair of cards has, and how many have been drawn
        //: so far. Counted up front because the fan-out needs to know the total
        //: before it places the first one.
        const pairCount = {}, pairSeen = {};
        (g.edges || []).forEach(e => {
          if (!e || !e.src || !e.dst || e.src === e.dst) return;
          const k = [e.src, e.dst].sort().join("\u0000");
          pairCount[k] = (pairCount[k] || 0) + 1;
        });
        (g.edges || []).forEach(e => {
          try {
          if (!e.src || !e.dst) return;
          const id = e.src + "->" + e.dst + ":" + (e.type||"");
          liveEdges.add(id);
          // human-readable edge label ("tested by", "criterion for", …) in research
          const ekey = "graph.edge." + e.type;
          //: Which of the links between these two cards this one is. Both
          //: directions count as the same pair: a link back the other way is
          //: drawn over the same ground.
          const pairKey = [e.src, e.dst].sort().join("\u0000");
          const pairIndex = (pairSeen[pairKey] = (pairSeen[pairKey] || 0) + 1) - 1;
          const rlabel = research ? t(ekey, R_EDGE_NAME[e.type] || e.type || "") : (e.type || "");
          const edge = { id, from:e.src, to:e.dst,
                         label: e.provenance ? ""
                                : (research ? edgeLabel(rlabel) : rlabel) };
          // A link inside one band joins two cards on the same row, and a
          // bezier told to bend vertically between them draws a straight line
          // straight through everything in between — the evidence that supports
          // a hypothesis six cards to its left cut across four other cards. Arc
          // those; keep the vertical bend for the links that really do travel
          // down the page from one stage to the next.
          // How the link is drawn: what `routeEdges` decided from the final
          // coordinates if it has run, and otherwise a first-frame guess — a
          // link inside one band joins two cards side by side and needs to arc,
          // anything else starts straight. Re-applying the routing HERE is what
          // makes it hold: this block runs on every poll, so a rebuild that
          // used the guess would undo the routing a second after it was made
          // and the study would go back to drawing lines through its own cards.
          if (research && place) {
            if (id in routed) {
              edge.smooth = routed[id];
            } else {
              const a = place[e.src], b = place[e.dst];
              if (a && b) edge.smooth = a.stage === b.stage
                ? { type: "curvedCW", roundness: 0.22 } : false;
            }
          }
          if (research && (e.type === "realises" || e.type === "elaborates")) {
            edge.color = { color: EDGE_QUIET, highlight: EDGE_BRIGHT };
            edge.dashes = [2, 4]; edge.width = 1.6;
            edge.font = edgeFont(EDGE_QUIET, 12);
          }
          else if (e.synthetic) { edge.color={color:"#2c313a",highlight:"#3a4150"}; edge.dashes=true; edge.width=1; edge.arrows=""; edge.label=""; }
          else if (research) { const c=R_EDGE[e.type];
            edge.color={color:c||EDGE_NEUTRAL,highlight:c||EDGE_BRIGHT};
            edge.width=c?3:2.2;
            edge.font=edgeFont(c||EDGE_NEUTRAL); }
          // How the study MOVED: the verdict that retired one hypothesis and
          // the change that produced the next. Without the label this is just
          // an unexplained arrow between two look-alike cards.
          if (research && e.type === "supersedes") {
            const v = (e.attrs || {}).verdict || "other";
            const c = v === "refuted" ? CRIT : v === "confirmed" ? GOOD : WARN;
            edge.dashes = [5, 4]; edge.width = 2.2;
            edge.color = { color: c, highlight: c, hover: c };
            edge.font = edgeFont(c);
            edge.label = edgeLabel(t('graph.edge.supersedes.' + v,
                                     { reason: (e.attrs || {}).reason || "" }));
          } else if (research && e.rerouted) {
            // The link ran through something folded into a card. Drawn thinner
            // so it reads as inferred, and the tooltip names what it went via.
            edge.dashes = [2, 3]; edge.width = 1;
            edge.title = t('graph.edge.via', { node: e.via || "" });
          }
          // Fanned out when there is more than one: index 0 keeps whatever
          // curvature the rules above chose, and each further link is pushed
          // a little further off the straight line, alternating sides. Done
          // last so it overrides those rules rather than being overridden.
          if ((pairCount[pairKey] || 0) > 1) {
            const step = 0.18, rank = Math.floor(pairIndex / 2) + 1;
            const sign = pairIndex % 2 ? -1 : 1;
            const base = (edge.smooth && typeof edge.smooth.roundness === "number")
              ? edge.smooth.roundness : 0;
            edge.smooth = { enabled: true,
                            type: sign > 0 ? "curvedCW" : "curvedCCW",
                            roundness: Math.min(0.9, base + step * rank) };
          }
          batchEdges.push(edge);
          } catch (err) { console.warn("graph edge", e && e.src, err); }
        });
        // Two calls instead of 2N, and only now — a throw above cost the whole
        // drawing when each node updated the DataSet on its own.
        if (batchNodes.length) nodes.update(batchNodes);
        if (batchEdges.length) edges.update(batchEdges);
        // After the cards are in: `getBoundingBox` has nothing to report for a
        // node vis has not drawn yet, and the halo is measured off the box.
        setPulsing(working);
        // Reconciliation: what the server no longer sends must leave the canvas.
        // Nothing was ever removed, so a node that changed id, moved into
        // another card or belonged to a study the reader switched away from
        // stayed on screen until the page was reloaded.
        const goneNodes = nodes.getIds().filter(id => !liveNodes.has(id));
        if (goneNodes.length) {
          nodes.remove(goneNodes);
          goneNodes.forEach(id => { delete nodeData[id]; });
          if (selectedId && goneNodes.indexOf(selectedId) !== -1) closeDetail();
        }
        const goneEdges = edges.getIds().filter(id => !liveEdges.has(id));
        if (goneEdges.length) edges.remove(goneEdges);
        // Frame the study once it first has something to show. Research only:
        // execution cards are pinned at server-given coordinates and a fit
        // would drag the camera away from the part of the run in progress.
        if (research && batchNodes.length) {
          // Which cards there are, how they stand and which band they are in —
          // and deliberately NOT how long their text is. Keying on the text
          // meant a method whose procedure gained a clause re-placed the entire
          // study under the reader's cursor; the card grows in place instead,
          // and the next real change re-places it. The stage stays in: a method
          // that moves to the literature band changes every band below it.
          const signature = ordered
            .map(n => [n.id, n.status, stageOf(n)].join(":"))
            .join("|")
            + "#" + (g.edges || []).length;
          const seq = studyGen;
          network.once("afterDrawing", () => {
            if (seq !== studyGen) return;
            reflowStages(place, signature, g.edges || []).catch(err => {
              console.warn("layout rejected", err);
              return false;
            }).then(reflowed => {
              // The abandoned study's continuation must not consume the
              // one-shot latch: it used to claim `fitted`, frame the canvas
              // against the other study's bands, and leave the study the reader
              // actually picked unframed for the rest of the session.
              if (seq !== studyGen || fitted) return;
              fitted = true;
              // The reflow moves every card, and the boxes frameStudy measures
              // are a frame behind it — so the frame waits for the redraw the
              // reflow just scheduled instead of measuring where cards used to
              // be.
              if (reflowed) network.once("afterDrawing", frameStudy);
              else frameStudy();
            });
          });
        }
        if (research) renderHeader(g);
        else revealWantedCall();
        // A research graph outlives one prompt, so a session can be showing a
        // study that has not moved since yesterday. Say when it last changed;
        // otherwise "the new run produced nothing" looks like a stale view.
        let age = "";
        if (research && g.updated_at) {
          const mins = (Date.now() / 1000 - g.updated_at) / 60;
          age = mins < 2 ? t('graph.age.justNow')
             : mins < 90 ? t('graph.age.min', { mins: Math.round(mins) })
             : mins < 60 * 36 ? t('graph.age.hours', { hours: Math.round(mins / 60) })
             : t('graph.age.date', { date: new Date(g.updated_at * 1000).toLocaleString() });
        }
        document.getElementById("status").textContent = t('graph.status', {
          nodes: (g.nodes||[]).length, edges: (g.edges||[]).length
        }) + age;
      } catch (err) {
        if (pollGeneration !== studyGen) return;
        // Stale activity must not keep animating when the feed that could end
        // it is unavailable. Keep the cards for inspection, but stop claiming
        // that work is currently running.
        setPulsing(new Set());
        document.getElementById("status").textContent = t('graph.error', { error: err });
      } finally {
        if (pollInFlightFor === pollGeneration) pollInFlightFor = null;
      }
    }

    // ── framing the study ─────────────────────────────────────────────────────
    // A plain fit is not enough. vis stops drawing a label once fontSize ×
    // scale falls under its scaling.label.drawThreshold of 5, so a study too
    // big for the window came back as a field of blank boxes: the fit had
    // zoomed to 0.21 and taken every word on the canvas with it. Below the
    // readable floor the study is panned, not shrunk — it opens at its
    // beginning, which is where a reader starts anyway, and the wheel is still
    // there for anyone who wants the whole shape at a glance.
    const MIN_READABLE_SCALE = 0.55;    // a 16px card font ≈ 9px on screen
    function frameStudy(){
      try {
        const ids = nodes.getIds();
        if (!ids.length) return;
        // Cards, not centres: getPositions() returns the middle of a card, and
        // a card is up to 340 wide and as tall as its text made it.
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        ids.forEach(id => {
          let box = null;
          try { box = network.getBoundingBox(id); } catch (err) { /* undrawn */ }
          if (!box) return;
          x0 = Math.min(x0, box.left); x1 = Math.max(x1, box.right);
          y0 = Math.min(y0, box.top);  y1 = Math.max(y1, box.bottom);
        });
        // The bands are part of the picture — an empty "report" row is the
        // answer to "how far has this got" — so the frame has to hold them too,
        // or the camera centres on the cards and cuts the row off.
        stageBands.forEach(b => {
          x0 = Math.min(x0, b.railLeft != null ? b.railLeft : b.left);
          x1 = Math.max(x1, b.right);
          y0 = Math.min(y0, b.top);  y1 = Math.max(y1, b.bottom);
        });
        if (!(x1 > x0 && y1 > y0)) { network.fit({ animation: false }); return; }
        const canvas = document.getElementById("net");
        // The header floats over the canvas — by design, so the canvas stays
        // draggable under it — so the study is framed into the band left below
        // it. A plain fit() centres on the whole canvas and slides the first
        // row of cards under the question.
        const top = (document.getElementById("head").offsetHeight || 0) + 16;
        const padX = 40, padY = 24;
        const availW = Math.max(160, canvas.clientWidth - padX * 2);
        const availH = Math.max(160, canvas.clientHeight - top - padY);
        // Never past the point where vis stops drawing a label (fontSize ×
        // scale under its drawThreshold of 5): a study bigger than the band is
        // panned, not shrunk into eighteen blank boxes. Never magnified past
        // 1:1 either — a two-card study blown up to fill the screen reads as a
        // poster, not as a graph.
        const scale = Math.max(MIN_READABLE_SCALE,
          Math.min(1, availW / (x1 - x0), availH / (y1 - y0)));
        // Hung from the top of the band, because a reader starts at the top.
        // Across, the centre of the bounding box is right only while the whole
        // study fits. Past that it used to be empty canvas — the layout puts the
        // question wherever its children's barycentre falls — so the camera
        // opened on the spine instead, the question and the hypothesis.
        //
        // The left edge is the better anchor now that there IS something there:
        // the stage names in the rail, the study's general steps, and the
        // experiment module's detailed tasks under them. That is where reading
        // starts, it cannot be blank, and unlike a barycentre it does not move.
        let cx = (x0 + x1) / 2;
        if (scale <= MIN_READABLE_SCALE + 1e-6)
          cx = x0 + availW / (2 * scale);
        network.moveTo({ scale: scale, position: {
          x: cx,
          y: y0 + (canvas.clientHeight / 2 - top) / scale,
        } });
      } catch (err) { /* no nodes yet */ }
    }

    // ── header ────────────────────────────────────────────────────────────────
    // The question itself is the header. The status tiles that stood under it
    // were a second legend — a count per hypothesis state — and the states are
    // already on the nodes, in colour and in words.
    // The question, how its branches stand, and what the record is missing.
    // The tally is the one thing a reader wants before reading any card: how
    // much of this study is settled. The gaps line is the other half of that —
    // an empty canvas used to mean three different things (nobody wrote
    // anything / the writes were refused / the request failed) and looked
    // identical in all three.
    // What the study holds, by the type the cards are labelled with, plus the
    // records folded into them — a dataset or a script is still part of the
    // count even when it is drawn as a chip on its observation rather than as
    // a card of its own.
    function inventoryTiles(g){
      const byKind = {}, word = {};
      let folded = 0;
      (g.nodes || []).forEach(n => {
        byKind[n.kind] = (byKind[n.kind] || 0) + 1;
        // rTypeName, so a tile is worded exactly like the cards it counts. The
        // client's own table calls Evidence "Данные" where the server says
        // "Свидетельство", and a header that renames what it counts reads as a
        // second, different tally.
        if (!word[n.kind]) word[n.kind] = rTypeName(n);
        folded += (n.attachments || []).length + (n.chips || []).length;
      });
      const tiles = Object.keys(byKind)
        .sort((a, b) => byKind[b] - byKind[a])
        // "18 × Свидетельство" rather than "18 Свидетельство": the server
        // words a type in the singular, and neither language declines it here.
        .map(kind => `<span class="tile" style="color:${INK};border-color:${rgba(SLATE,.5)}">`
          + `${R_ICON[kind] || "•"} ${byKind[kind]} × ${esc(word[kind] || kind)}</span>`);
      if (folded)
        tiles.push(`<span class="tile" style="color:${col('--ink2')};border-color:${rgba(SLATE,.5)}">`
          + `📎 ${esc(t('graph.count.attached', { count: folded }))}</span>`);
      return tiles.join("");
    }
    // Who produced the record, and over what stretch of time. A reader asking
    // "where did this come from" is asking about the agent, and the answer was
    // only ever visible one card at a time.
    function contributorLine(g){
      const list = g.nodes || [];
      if (!list.length) return "";
      const agents = {};
      let from = Infinity, to = 0;
      list.forEach(n => {
        if (n.executor_agent) agents[n.executor_agent] = (agents[n.executor_agent] || 0) + 1;
        if (n.t_start) from = Math.min(from, n.t_start);
        if (n.t_end || n.t_start) to = Math.max(to, n.t_end || n.t_start);
      });
      const who = Object.keys(agents).sort((a, b) => agents[b] - agents[a])
        .map(a => `${esc(shortAgent(a))} ${agents[a]}`).join("  ·  ");
      const span = (from < Infinity && to > from)
        ? t('graph.header.span', {
            from: new Date(from * 1000).toLocaleString(),
            mins: Math.max(1, Math.round((to - from) / 60)) }) : "";
      return [who, esc(span)].filter(Boolean).join("　—　");
    }
    function renderHeader(g){
      const head = (g && g.headline) || {};
      const qText = head.question || "";
      const qEl = document.getElementById("question");
      // Clamped to three lines in CSS, so the whole question has to be reachable
      // somewhere: the tooltip carries it verbatim.
      qEl.title = qText;
      qEl.innerHTML = qText
        ? `<span class="q">❓ ${esc(head.root_id || "")}</span> · ${esc(qText)}` : "";

      const c = (g && g.counters) || {};
      let tiles = [["confirmed", "✓", GOOD], ["refuted", "✗", CRIT],
                   ["under_verification", "⧗", WARN], ["inconclusive", "≈", ORANGE],
                   ["formulated", "○", INFO], ["postponed", "⏸", SLATE]]
        .filter(([key]) => c[key])
        .map(([key, glyph, col]) =>
          `<span class="tile" style="color:${col};border-color:${rgba(col,.35)}">`
          + `${glyph} ${c[key]} ${esc(t('graph.counters.' + key))}</span>`).join("");
      // The hypothesis tally is empty until a study has hypotheses, and a run
      // that only gathered observations has none — so the header went blank and
      // left the three orange "missing" chips as the only thing above the
      // canvas. A study of eighteen observations is not an empty study: say
      // what it does hold, counted by the type a reader sees on the cards.
      if (!tiles) tiles = inventoryTiles(g);
      document.getElementById("counters").innerHTML = tiles;

      const meta = head.iterations
        ? esc(t('graph.header.meta', { branches: head.branches || 1,
                                       iterations: head.iterations }))
        : contributorLine(g);
      document.getElementById("meta").innerHTML = meta;

      document.getElementById("gaps").innerHTML = ((g && g.gaps) || [])
        .map(x => `<span class="gap">${esc(t('graph.gap.' + x.code,
                                             { count: x.count }))}</span>`).join("");
    }
    function updateChrome(){
      const r = isResearch();
      document.getElementById("head").classList.toggle("hidden", !r);
      document.getElementById("net").style.top = "46px";
    }

    // ── detail panel (with provenance) ────────────────────────────────────────
    let selectedId = null;
    // Opening a card is where the short line on the canvas becomes the account
    // of a step: what it says, why it ended the way it did, how it got there,
    // what it produced and what it connects to. The panel used to render the
    // attributes flat (a nested object came out as "[object Object]"), showed
    // provenance for evidence alone, and rewrote itself through innerHTML on
    // every 1.5-second poll, so a long read snapped back to the top.
    function showDetail(n){
      if (!n) return;
      if (!isResearch() && !RESEARCH_KINDS.has(n.kind)) return showDetailClassic(n);
      if (n.kind === "framing") return showFramingDetail(n);
      const st = rStatus(n.status);
      let body = "";
      // A write-up card carries the whole document, not a line about itself, so
      // the block is titled for what it is. `reportBlock` already renders
      // markdown through marked + DOMPurify and scrolls.
      const isWriteUp = n.kind === "report";
      body += reportBlock(
        isWriteUp ? t('graph.type.report') : t('graph.detail.says'),
        n.output || n.label, isWriteUp);
      if (n.why)
        body += `<div class="k">${t('graph.why.title')}</div>${proseBlock(n.why)}`;
      else if (n.why_missing)
        body += `<div class="k">${t('graph.why.title')}</div>`
              + `<div class="empty">${esc(t('graph.why.missing'))}</div>`;
      // The research card's own fields: these keys are attribute codes the
      // server sends for the browser to translate (i18n.js says so explicitly).
      body += readable(t('graph.detail.details'), n.input, null, true, true);
      body += nodeReportBlock(n);
      body += historyBlock(n.status_history);
      body += attachmentsBlock(n.chips, t('graph.chips.tools'));
      body += attachmentsBlock(n.attachments, t('graph.attach.title'));
      body += linksBlock(n.id);
      body += provBlock(n.provenance);
      body += contributorsBlock(n.contributors);
      if (!body) body = `<div class="empty">${esc(t('graph.detail.empty'))}</div>`;
      const head = `<div class="dhead"><span class="close" onclick="closeDetail()">✕</span>`
        + `<h3>${R_ICON[n.kind]||"•"} ${esc(rTypeName(n))}${n.index ? " " + n.index : ""}</h3>`
        + `<div class="sub">${esc(n.id)}${n.executor_agent ? esc(" · " + t('graph.detail.by', { agent: shortAgent(n.executor_agent) })) : ""}</div>`
        // The same word must not be green on the card and amber in the
        // panel, so the badge reads off the same three-way scale.
        + (() => { const sc = statusInk(n.status); return `<span class="badge" style="background:${rgba(sc,.18)};color:${sc};border:1px solid ${sc}">${st.g} ${esc(rStatusWord(n))}</span></div>`; })();
      paint(n, head + `<div class="dbody">${body}</div>`);
    }
    // How it got here: every move, who made it and what they gave as the reason.
    function historyBlock(history){
      if (!Array.isArray(history) || !history.length) return "";
      return `<div class="k">${t('graph.history.title')}</div>`
        + history.map(h => {
            const line = h.from
              ? t('graph.history.entry', { from: h.from_word || h.from,
                                           to: h.to_word || h.to,
                                           source: h.source || "" })
              : t('graph.history.initial', { status: h.to_word || h.to || "" });
            const when = h.at ? new Date(h.at * 1000).toLocaleString() : "";
            return `<div class="prov"><span class="tool">${esc(line)}</span>`
              + (when ? `<span class="jump">${esc(when)}</span>` : "")
              + (h.reason ? `<div class="res">${esc(h.reason)}</div>` : "") + `</div>`;
          }).join("");
    }
    // The engineering the card folded in: the tools it ran on, the datasets and
    // code it produced. Drawn as boxes they buried the findings; dropped, they
    // took their edges with them. Here they are, with a link where there is one.
    function attachmentsBlock(list, title){
      if (!Array.isArray(list) || !list.length) return "";
      return `<div class="k">${esc(title)} <span class="chars">${list.length}</span></div>`
        + list.map(a => {
            const label = esc(a.label || a.id || "");
            const name = a.href
              ? `<a class="uri" href="${esc(a.href)}" target="_blank" rel="noopener noreferrer">${label}</a>`
              : `<span class="uri">${label}</span>`;
            return `<div class="art"><span class="ic">${R_ICON[a.kind] || "📦"}</span>${name}`
              + (a.type_word ? `<span class="by">${esc(a.type_word)}</span>` : "") + `</div>`;
          }).join("");
    }
    // What this card connects to, in words, and clickable — following a link by
    // eye across a wide canvas is exactly what a graph should spare you.
    function linksBlock(id){
      const rows = (lastGraph.edges || []).filter(e => e.src === id || e.dst === id)
        .map(e => {
          const out = e.src === id, other = out ? e.dst : e.src;
          if (!nodeData[other]) return "";
          const verb = t("graph.edge." + e.type, R_EDGE_NAME[e.type] || e.type || "");
          // The arrow carries the direction, so the row reads as one phrase.
          // It used to print "приходит из · проверяется": the dot separated a
          // direction from an edge name and read as a typo, and worse, made
          // "проверяется" look like this node's state rather than the LINK's
          // name.
          const arrow = out ? "→" : "←";
          return `<div class="prov" onclick="focusNode('${esc(String(other))}')">`
            + `<span class="tool">${arrow} ${esc(verb)}</span>`
            + `<span class="jump">${esc(rTypeName(nodeData[other]))} ${esc(other)}</span>`
            + `<div class="res">${esc(firstSentence(rText(nodeData[other]), 110))}</div></div>`;
        }).filter(Boolean).join("");
      return rows ? `<div class="k">${t('graph.links.title')}</div>${rows}` : "";
    }
    // Which tool calls back this record. No longer gated on evidence: a method
    // and a conclusion are judged on their trace too.
    function provBlock(prov){
      if (!Array.isArray(prov) || !prov.length) return "";
      return `<div class="k">${t('graph.detail.provenance')}</div>` + prov.map(p => {
        const jump = p.exec_id ? ` onclick="jumpToExecution('${esc(String(p.exec_id))}')" title="${esc(t('graph.detail.openInLog'))}"` : "";
        return `<div class="prov"${jump}><span class="tool">🛠️ ${esc(p.tool||t('graph.detail.call'))}</span>`
          + (p.exec_id ? `<span class="jump">${esc(t('graph.detail.execLog'))}</span>` : "")
          + (p.result ? `<div class="res">${esc(p.result)}</div>` : "") + `</div>`;
      }).join("");
    }
    // Who took part, and on what basis we say so.
    //
    // The difference is load-bearing. A PLANNED assignee is who the plan named;
    // nothing observed that they did the work, and until now that was the only
    // thing recorded about a plan step. Everything else here — wrote it, moved
    // it, delegated it, took it under a work order, ran it — is something the
    // system watched happen. Drawing the two alike is exactly how a reader ends
    // up certain that the wrong agent did something, so the planned ones sit
    // last, dimmed, and say so in words.
    function contributorsBlock(list){
      if (!Array.isArray(list) || !list.length) return "";
      return `<div class="k">${esc(t('graph.contrib.title'))} <span class="chars">${list.length}</span></div>`
        + list.map(c => {
            const basis = esc(t('graph.basis.' + c.basis, c.basis || ""));
            const jump = c.exec_id
              ? ` onclick="jumpToExecution('${esc(String(c.exec_id))}')" title="${esc(t('graph.detail.openInLog'))}"`
              : "";
            const mark = c.observed ? "●" : "○";
            return `<div class="prov${c.observed ? "" : " dim"}"${jump}>`
              + `<span class="tool">${mark} ${esc(c.agent ? shortAgent(c.agent) : "")}</span>`
              + `<span class="jump">${basis}</span></div>`;
          }).join("");
    }
    function focusNode(id){
      if (!nodeData[id]) return;
      selectedId = id; lastDetailStamp = JSON.stringify(nodeData[id]);
      try { network.selectNodes([id]); network.focus(id, { scale: 1.0, animation: true }); }
      catch (err) { /* the node may not be on the canvas yet */ }
      showDetail(nodeData[id]);
    }
    // ── readable values ──────────────────────────────────────────────────────
    // What an agent or a tool was given and what it returned is recorded three
    // ways, depending on the age of the snapshot: an object, a JSON string, or
    // the recorder's "key: value" lines. All three come back as one object so
    // the panel can lay them out as labelled rows instead of a wall of braces.
    let salvaged = false;   // set by parseValue when a cut JSON value was repaired
    function parseValue(v){
      salvaged = false;
      if (v === null || v === undefined) return null;
      if (typeof v === "object") return v;
      if (typeof v !== "string") return v;
      const s = v.trim();
      if (!s) return null;
      if (/^[\[{]/.test(s)) {
        try { return JSON.parse(s); } catch (e) {}
        const saved = salvageJSON(s);
        if (saved !== null) { salvaged = true; return saved; }
      }
      // Argument names, not prose: "Note: …" at the top of an answer is text.
      const KEY = /^([a-z_][a-z0-9_.-]{0,40}):(?:\s(.*))?$/;
      const lines = s.split("\n");
      if (!KEY.test(lines[0])) return s;
      const obj = {}; let key = null;
      for (const line of lines) {
        const m = line.match(KEY);
        if (m) { key = m[1]; obj[key] = m[2] === undefined ? "" : m[2]; }
        else obj[key] += (obj[key] ? "\n" : "") + line.replace(/^  /, "");
      }
      for (const k in obj) {
        const t = String(obj[k]).trim();
        if (/^[\[{]/.test(t)) { try { obj[k] = JSON.parse(t); } catch (e) {} }
      }
      return obj;
    }
    // The recorder keeps the first N characters of a value and says how many
    // it dropped. A JSON dump cut that way no longer parses, and a wall of
    // braces was the thing the panel is here to replace, so the open strings
    // and brackets are closed and, failing that, the text is backed off to the
    // last whole element until what is left parses. The note on how much was
    // dropped stays; see truncationNote().
    const CUT_MARK = /\n?… \[(\d+) more characters\]\s*$/;
    function salvageJSON(s){
      let text = s.replace(CUT_MARK, "");
      for (let attempt = 0; attempt < 60; attempt++) {
        try { return JSON.parse(closeOpen(text)); } catch (e) {}
        const cut = Math.max(text.lastIndexOf(","), text.lastIndexOf("{"),
                             text.lastIndexOf("["), text.lastIndexOf(":"));
        if (cut <= 0) return null;
        text = text.slice(0, cut);
      }
      return null;
    }
    function closeOpen(text){
      const stack = []; let inStr = false, escaped = false;
      for (const ch of text) {
        if (inStr) {
          if (escaped) escaped = false;
          else if (ch === "\\") escaped = true;
          else if (ch === '"') inStr = false;
          continue;
        }
        if (ch === '"') inStr = true;
        else if (ch === "{" || ch === "[") stack.push(ch === "{" ? "}" : "]");
        else if (ch === "}" || ch === "]") stack.pop();
      }
      let out = inStr ? text + '"' : text;
      out = out.replace(/,\s*$/, "").replace(/"(?:[^"\\]|\\.)*"\s*:\s*$/, "").replace(/,\s*$/, "");
      return out + stack.reverse().join("");
    }
    function truncationNote(value, repaired){
      const m = typeof value === "string" ? value.match(CUT_MARK) : null;
      if (m) {
        const kept = value.length - m[0].length;
        return `<div class="empty" style="margin-top:6px">`
          + esc(t('graph.detail.truncated', { kept: kept.toLocaleString(), dropped: Number(m[1]).toLocaleString() }))
          + `</div>`;
      }
      // Cut by a recorder that left no marker: only the repair says so.
      return repaired ? `<div class="empty" style="margin-top:6px">${esc(t('graph.detail.cutShort'))}</div>` : "";
    }
    // Bookkeeping fields nobody reads, and values already said once.
    // Execution-graph bookkeeping. Research field codes share this namespace
    // now, so a node attribute named e.g. `verdict` would be dropped from the
    // panel without a word — no schema type declares one today, and nothing on
    // disk carries one, but do not add such an attribute without renaming here.
    const NOISE_KEYS = new Set(["is_root", "routing", "run_id", "semantic", "verdict",
                                "parent_ids", "turn_id"]);
    // The server sends attribute CODES, and for the framing card's members
    // `type:<kind>`; both are turned into the reader's words here. An unknown
    // code degrades to itself with the underscores opened up, never to a blank.
    function fieldLabel(k){
      const s = String(k);
      if (s.indexOf("type:") === 0) {
        const kind = s.slice(5);
        return t('graph.type.' + kind, kind);
      }
      return t('graph.field.' + s, s.replace(/_/g, " "));
    }
    const isScalar = x => x === null || typeof x !== "object";
    const isEmpty = v => v === null || v === undefined || v === ""
      || (Array.isArray(v) && !v.length)
      || (typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length);
    function tidy(obj, ctx){
      const out = {}, seen = new Set();
      for (const [k, v] of Object.entries(obj)) {
        if (NOISE_KEYS.has(k) || isEmpty(v)) continue;
        if (k === "name" && ctx && ctx.agent && v === ctx.agent) continue; // the heading says it
        const sig = isScalar(v) ? String(v) : JSON.stringify(v);
        if (seen.has(sig)) continue;                        // "role" repeating "description"
        seen.add(sig); out[k] = v;
      }
      return out;
    }
    // `fields` opts into translating the keys, and ONLY the research card does.
    // This is the single renderer for both panels, and the execution log's rows
    // are raw tool ARGUMENT names: `write_file(file_path, content, overwrite)`
    // records an argument literally called `content`, and `graph.field.content`
    // means "Finding". Translating unconditionally captioned the file body it
    // was about to write as «Результат», next to the real result block.
    // A DOI is an address, not prose. The panel printed `10.1021/acs.jafc.2c05393`
    // as escaped text, so the one thing a reader wants to do with it — open the
    // paper — took a copy-paste out of the page. Linkified only where `fields`
    // is on, i.e. the research card: the execution log's rows are raw tool
    // arguments and must stay literal.
    const DOI_RE = /^(?:doi:\s*|https?:\/\/(?:dx\.)?doi\.org\/)?(10\.\d{4,9}\/[^\s"<>]+)$/i;
    const URL_RE = /^https?:\/\/[^\s"<>]+$/;
    function anchor(href, label){
      return `<a class="uri" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;
    }
    function scalarValue(text, fields){
      if (!fields) return esc(text);
      const trimmed = String(text).trim();
      // Not encodeURIComponent: a DOI's slash is part of the identifier, and
      // escaping it produces a doi.org link that resolves to nothing.
      const doi = trimmed.match(DOI_RE);
      if (doi) return anchor("https://doi.org/" + doi[1], trimmed);
      if (URL_RE.test(trimmed)) return anchor(trimmed, trimmed);
      return esc(text);
    }
    function kvRows(obj, depth, fields){
      return `<div class="kv">` + Object.entries(obj).map(([k, v]) => {
        const key = `<span class="key">${esc(fields ? fieldLabel(k) : k)}</span>`;
        if (!isScalar(v)) {
          if (Array.isArray(v) && v.every(x => isScalar(x) && String(x).length <= 40))
            return `<div class="row">${key}<span class="val">`
              + v.map(x => `<span class="pill">${scalarValue(x, fields)}</span>`).join("") + `</span></div>`;
          const count = Array.isArray(v) ? t('graph.count.item', { count: v.length })
                                         : t('graph.count.field', { count: Object.keys(v).length });
          return `<div class="row">${key}<span class="val dim">${count}</span>`
            + `<div class="nested">${nestedValue(v, depth + 1, fields)}</div></div>`;
        }
        const text = String(v);
        const long = text.length > 90 || text.includes("\n");
        // A card's long field is the agent's prose, and that is markdown.
        const html = long && fields ? markdown(text) : null;
        if (html) return `<div class="row">${key}<div class="val block report">${html}</div></div>`;
        return `<div class="row">${key}<span class="val${long ? " block" : ""}">${scalarValue(text, fields)}</span></div>`;
      }).join("") + `</div>`;
    }
    function nestedValue(v, depth, fields){
      if (depth > 4) return `<pre>${esc(JSON.stringify(v, null, 2))}</pre>`;
      if (Array.isArray(v))
        return `<ol class="items">` + v.map(x =>
          `<li>${isScalar(x) ? scalarValue(x, fields) : nestedValue(x, depth, fields)}</li>`).join("") + `</ol>`;
      return kvRows(v, depth, fields);
    }
    // A titled block: labelled rows for a mapping, a list for a list, the text
    // itself for prose, and nothing at all when there is nothing to show.
    // Prose from an agent or a person, rendered as markdown; plain text when
    // the markdown libraries did not load.
    function proseBlock(text){
      const html = markdown(text);
      return html ? `<div class="report">${html}</div>` : `<pre>${esc(String(text))}</pre>`;
    }
    // `prose`: a plain string here is words, not a tool's arguments or output,
    // so it is rendered as markdown rather than kept verbatim.
    function readable(title, value, ctx, fields, prose){
      const v = parseValue(value), repaired = salvaged;
      if (v === null) return "";
      let body;
      if (Array.isArray(v)) body = nestedValue(v, 0, fields);
      else if (typeof v === "object") {
        const t = tidy(v, ctx);
        if (!Object.keys(t).length) return "";
        body = kvRows(t, 0, fields);
      } else body = prose ? proseBlock(String(v)) : `<pre>${esc(String(v))}</pre>`;
      const raw = typeof value === "string" ? value.length : 0;
      const size = raw > 900 ? ` <span class="chars">${esc(t('graph.chars', { count: raw.toLocaleString() }))}</span>` : "";
      return `<div class="k">${title}${size}</div>${body}${truncationNote(value, repaired)}`;
    }
    // One line saying what a call was about, so the history scans unopened.
    function gistOf(value){
      const v = parseValue(value);
      if (v === null) return "";
      let text;
      if (Array.isArray(v)) text = t('graph.count.item', { count: v.length });
      else if (typeof v === "object")
        text = Object.entries(tidy(v)).map(([k, x]) => `${k}: `
          + (isScalar(x) ? String(x).replace(/\s+/g, " ").slice(0, 48)
                         : Array.isArray(x) ? t('graph.count.item', { count: x.length }) : "…")).join("  ·  ");
      else text = String(v).replace(/\s+/g, " ");
      return text.length > 140 ? text.slice(0, 140) + "…" : text;
    }

    // ── the execution panel ──────────────────────────────────────────────────
    const openCalls = new Set();      // calls the reader has unfolded
    let focusCallId = null, focusPending = false;   // a call reached from evidence
    let paintedId = null;
    // Live redraws of the node already on show keep the reader's place; a new
    // node opens at the top.
    function paint(n, html){
      const box = document.getElementById("detail");
      const top = paintedId === n.id ? box.scrollTop : 0;
      box.classList.toggle("framing-detail", n.kind === "framing");
      box.innerHTML = html; box.style.display = "block"; box.scrollTop = top;
      document.getElementById("dgrip").style.display = "block";
      paintedId = n.id;
      if (focusCallId) {
        const el = box.querySelector(`.call[data-call="${CSS.escape(focusCallId)}"]`);
        if (el) { el.classList.add("focus");
                  if (focusPending) { el.scrollIntoView({ block: "center" }); focusPending = false; } }
      }
    }
    const KIND_WORD = { goal:"request", result:"answer", agent:"agent", agent_call:"agent",
                        tool_call:"tool call", system:"system", decision:"decision" };
    const kindWord = n => {
      const key = "graph.kind." + n.kind;
      return t(key, KIND_WORD[n.kind] || n.kind || "");
    };
    // Which of the two tabs an agent's panel opens on; remembered per browser.
    const TAB_KEY = "graph.panelTab";
    let panelTab = "report";
    try { panelTab = localStorage.getItem(TAB_KEY) === "more" ? "more" : "report"; } catch (e) {}
    function setPanelTab(tab){
      panelTab = tab === "more" ? "more" : "report";
      try { localStorage.setItem(TAB_KEY, panelTab); } catch (e) {}
      if (selectedId && nodeData[selectedId]) showDetail(nodeData[selectedId]);
    }
    function tabsHtml(){
      const tab = (id, label) => `<span class="tab${panelTab === id ? " on" : ""}" onclick="setPanelTab('${id}')">${esc(label)}</span>`;
      return `<div class="tabs">${tab("report", t('graph.tab.report'))}${tab("more", t('graph.tab.more'))}</div>`;
    }
    function headOf(n, title, tabs){
      const c = statusColor(n), at = clockOf(n), dur = secsOf(n);
      const sub = [kindWord(n),
                   n.runs > 1 ? t('graph.detail.runOf', { run: n.run, runs: n.runs }) : "",
                   at ? t('graph.detail.started', { at }) : "", dur].filter(Boolean).join(" · ");
      return `<div class="dhead"><span class="close" onclick="closeDetail()">✕</span>`
        + `<h3>${esc(title)}</h3><div class="sub">${esc(sub)}</div>`
        + (n.status ? `<span class="badge" style="background:${rgba(c,.18)};color:${c};border:1px solid ${c}">${esc(n.status)}</span>` : "")
        + (tabs || "") + `</div>`;
    }
    function callRow(c){
      const when = [clockOf(c), secsOf(c)].filter(Boolean).join(" · ");
      const gist = gistOf(c.input);
      const files = [...(c.input_files || []), ...(c.output_files || [])];
      const body = (readable(t('graph.detail.arguments'), c.input)
          || `<div class="k">${t('graph.detail.arguments')}</div><div class="empty">${t('graph.detail.none')}</div>`)
        + readable(t('graph.detail.result'), c.output)
        + (files.length ? `<div class="k">${t('graph.detail.files')}</div><div class="kv">` + files.map(f =>
            `<div class="row"><span class="val mono">${esc(f)}</span></div>`).join("") + `</div>` : "");
      return `<div class="call${openCalls.has(c.id) ? " open" : ""}" data-call="${esc(c.id)}">`
        + `<div class="hd" onclick="toggleCall(this.parentNode)">`
        + `<i class="st" style="background:${STATUS_COLOR[c.status] || "#cbd5e1"}" title="${esc(c.status || "")}"></i>`
        + `<span class="tool">${esc(c.tool || t('graph.detail.call'))}</span><span class="when">${esc(when)}</span>`
        + `<span class="caret">▶</span></div>`
        + (gist ? `<div class="gist">${esc(gist)}</div>` : "")
        + `<div class="bd">${body}</div></div>`;
    }
    function toggleCall(el){
      const id = el.dataset.call;
      if (openCalls.has(id)) { openCalls.delete(id); el.classList.remove("open"); }
      else { openCalls.add(id); el.classList.add("open"); }
    }
    // An agent's final words, rendered as the document they are. Plain text
    // when the markdown libraries did not load.
    function reportBlock(title, text, full){
      if (!text) return "";
      const raw = String(text);
      const html = markdown(raw);
      const size = raw.length > 900 ? ` <span class="chars">${esc(t('graph.chars', { count: raw.length.toLocaleString() }))}</span>` : "";
      // A quoted answer sits in a 52vh box beside the rest of the card. A
      // write-up IS the card, and boxing a document inside a panel that already
      // scrolls gives the reader two scrollbars and half a screen to read in.
      const cls = full ? "report full" : "report";
      return `<div class="k">${title}${size}</div>`
        + (html ? `<div class="${cls}">${html}</div>` : `<pre>${esc(raw)}</pre>`)
        + truncationNote(raw, false);
    }
    // ── files and pictures ───────────────────────────────────────────────────
    // An s3:// reference is not something a browser can open; the server's
    // artifact endpoint redirects to a fresh signed URL for it, so every such
    // reference becomes a link there. Anything that looks like a picture is
    // shown, not just named.
    const S3_RE = /s3:\/\/([^\/\s"'<>()\[\]]+)\/([^\s"'<>()\[\]]+)/g;
    function artifactHref(uri){
      const m = String(uri).match(/^s3:\/\/([^\/]+)\/(.+)$/);
      if (!m) return String(uri);
      return "/api/artifact/" + encodeURIComponent(m[1]) + "/"
        + m[2].split("/").map(encodeURIComponent).join("/");
    }
    const isImage = uri => /\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i.test(String(uri).split(/[?#]/)[0]);
    function picture(href, alt){
      return `<a class="pic" href="${esc(href)}" target="_blank" rel="noopener noreferrer">`
        + `<img src="${esc(href)}" alt="${esc(alt || "")}" loading="lazy"></a>`;
    }
    // Rendered markdown, with s3:// references turned into links, s3:// image
    // and link targets rewritten, and a preview under every picture link.
    function enrich(html){
      const box = document.createElement("div");
      box.innerHTML = html;
      const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
      const texts = [];
      for (let n = walker.nextNode(); n; n = walker.nextNode())
        if (S3_RE.test(n.nodeValue) && !n.parentNode.closest("a, code, pre")) texts.push(n);
      S3_RE.lastIndex = 0;
      for (const n of texts) {
        const span = document.createElement("span");
        span.innerHTML = esc(n.nodeValue).replace(S3_RE, m =>
          `<a href="${esc(artifactHref(m))}" data-uri="${esc(m)}" target="_blank" rel="noopener noreferrer">${esc(m)}</a>`);
        n.replaceWith(...span.childNodes);
      }
      box.querySelectorAll("code").forEach(c => {
        const m = c.textContent.trim().match(/^s3:\/\/[^\s]+$/);
        if (m && !c.closest("a, pre")) {
          const a = document.createElement("a");
          a.href = artifactHref(m[0]); a.dataset.uri = m[0]; a.target = "_blank"; a.rel = "noopener noreferrer";
          c.replaceWith(a); a.appendChild(c);
        }
      });
      box.querySelectorAll("img[src^='s3://']").forEach(img => { img.src = artifactHref(img.getAttribute("src")); });
      box.querySelectorAll("a[href^='s3://']").forEach(a => {
        a.dataset.uri = a.getAttribute("href"); a.href = artifactHref(a.getAttribute("href")); });
      box.querySelectorAll("a").forEach(a => {
        a.target = "_blank"; a.rel = "noopener noreferrer";
        const href = a.getAttribute("href") || "";
        // The picture test looks at the reference the agent wrote, not only
        // at the address it was rewritten to.
        if ((isImage(href) || isImage(a.dataset.uri || "")) && !a.querySelector("img") && !a.closest(".pic")) {
          const wrap = document.createElement("span");
          wrap.innerHTML = picture(href, a.textContent);
          a.after(wrap.firstChild);
        }
      });
      return box.innerHTML;
    }
    function markdown(text){
      if (!(window.marked && window.DOMPurify)) return null;
      try { return enrich(DOMPurify.sanitize(marked.parse(String(text)), { ADD_ATTR: ["target"] })); }
      catch (e) { return null; }
    }
    // What the agent left behind: files its tools wrote and links its report
    // names. Every one is a link; pictures are shown.
    function artifactsBlock(list){
      if (!Array.isArray(list) || !list.length) return "";
      return `<div class="k">${t('graph.detail.artifacts')} <span class="chars">${list.length}</span></div>` + list.map(a => {
        // `uri` is the durable reference and stays what the reader sees; the
        // anchor goes to the server's href when the projection minted one,
        // else through /api/artifact/ for an s3:// key. Pictures are shown.
        const file = a.kind === "file", href = a.href || artifactHref(a.uri), img = isImage(a.uri);
        return `<div class="art"><span class="ic">${img ? "🖼" : file ? "📦" : "🔗"}</span>`
          + `<a class="uri" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(a.uri)}</a>`
          + (a.tool ? `<span class="by">${esc(a.tool)}</span>` : "")
          + (img ? picture(href, a.uri) : "") + `</div>`;
      }).join("");
    }
    // ── the on-request summary ───────────────────────────────────────────────
    // A button until the reader asks; then a small model reads the agent's
    // trace and writes a few lines. Kept per node across redraws, so a live
    // poll does not take the summary away or ask the model again.
    const summaries = {};   // node id -> { loading } | { text, model, cached, stamp } | { error, stamp }
    // What the summary was written from; when it changes, the summary is old.
    const stampOf = n => [n.status, (n.calls || []).length, String(n.output || "").length,
                          String(n.input || "").length].join("|");
    const isRunning = n => n.status === "running";
    function summaryBlock(n){
      const st = summaries[n.id];
      const again = `<a onclick="requestSummary('${esc(n.id)}', true)">↻ ${esc(t('graph.summary.again'))}</a>`;
      let inner;
      if (!st) {
        // Written on its own once the agent is done; while it runs, the trace
        // is still growing and a summary of it would be out of date at once.
        if (isRunning(n)) inner = `<div class="ask"><div class="hint">${esc(t('graph.summary.waiting'))}</div>`
          + `<div class="meta" style="justify-content:center;border:0"><a onclick="requestSummary('${esc(n.id)}')">${esc(t('graph.summary.now'))}</a></div></div>`;
        else { setTimeout(() => requestSummary(n.id), 0);
               inner = `<div class="ask"><button class="sumbtn" disabled>⏳ ${esc(t('graph.summary.loading'))}</button></div>`; }
      }
      else if (st.loading) inner = `<div class="ask"><button class="sumbtn" disabled>⏳ ${esc(t('graph.summary.loading'))}</button></div>`;
      else if (st.error) inner = `<div class="err">${esc(t('graph.summary.failed', { error: st.error }))}</div><div class="meta">${again}</div>`;
      else {
        const html = markdown(st.text);
        const stale = st.stamp !== stampOf(n) ? `<span class="stale">${esc(t('graph.summary.stale'))}</span>` : "";
        inner = (html ? `<div class="mdoc">${html}</div>` : `<pre>${esc(st.text)}</pre>`)
          + `<div class="meta">${stale}${st.model ? `<span>${esc(t('graph.summary.by', { model: st.model }))}</span>` : ""}${again}</div>`;
      }
      return `<div class="sumbox">${inner}</div>`;
    }
    // ── a research node's own write-up ───────────────────────────────────────
    // What the execution log's summary is to an agent, this is to a node: what
    // it establishes, what it rests on, who took part and where the files are.
    // The body arrives inlined in the payload (the browser cannot fetch an
    // artifact's text), so this map only holds what is in flight.
    const nodeReports = {};
    const REPORTABLE = new Set(["evidence", "planstep", "experimenttask",
                                "verificationmethod"]);

    function nodeReportBlock(n){
      if (!REPORTABLE.has(String(n.kind || ""))) return "";
      const st = nodeReports[n.id] || {};
      const again = `<a onclick="requestNodeReport('${esc(n.id)}', true)">↻ ${esc(t('graph.nodeReport.again'))}</a>`;
      const title = `<div class="k">${esc(t('graph.nodeReport.title'))}</div>`;
      if (st.loading)
        return title + `<div class="sumbox"><div class="ask"><button class="sumbtn" disabled>⏳ ${esc(t('graph.nodeReport.writing'))}</button></div></div>`;
      if (st.error)
        return title + `<div class="sumbox"><div class="err">${esc(st.error)}</div><div class="meta">${again}</div></div>`;
      if (n.report) {
        const html = markdown(n.report);
        // Stale is worth saying, never worth hiding the report over: what it
        // records still happened.
        //
        // The verdict comes from the server (`report_stale`), which is the only
        // side that can reach it. This compared `st.stamp` — the stamp the write
        // RETURNED — against `n.report_stamp`, the stamp that same write stored
        // on the node: one value against itself, true only if publishing had
        // failed. A node that moved went on showing an account of what it used
        // to be, silently.
        const stale = n.report_stale
          ? `<span class="stale">${esc(t('graph.nodeReport.stale'))}</span>` : "";
        // And with auto-writing on, a stale one is brought up to date — once:
        // `nodeReports[id]` is set by the request itself, which is what stops a
        // node that keeps moving buying a model call on every render.
        if (n.report_stale && autoNodeReports() && isSettled(n))
          queueNodeReport(n.id);
        return title + `<div class="sumbox">`
          + (html ? `<div class="mdoc">${html}</div>` : `<pre>${esc(n.report)}</pre>`)
          + `<div class="meta">${stale}${again}</div></div>`;
      }
      if (autoNodeReports() && isSettled(n) && worthReporting(n)) {
        queueNodeReport(n.id);
        return title + `<div class="sumbox"><div class="ask"><button class="sumbtn" disabled>⏳ ${esc(t('graph.nodeReport.writing'))}</button></div></div>`;
      }
      return title + `<div class="sumbox"><div class="ask">`
        + `<button class="sumbtn" onclick="requestNodeReport('${esc(n.id)}')">${esc(t('graph.nodeReport.ask'))}</button></div></div>`;
    }

    // A node still moving will be described wrongly, and a node with nothing
    // recorded on it has nothing to describe — asking the model either way
    // spends a call to say so.
    const UNSETTLED = new Set(["todo", "in_progress", "formulated",
                               "under_verification", "draft", "planned",
                               // A method that has only been offered is the
                               // same case as a `planned` task: nothing has
                               // been done with it yet to describe.
                               "proposed"]);
    function isSettled(n){ return !UNSETTLED.has(String(n.status || "")); }
    function worthReporting(n){
      return (n.contributors || []).length > 0
        || (n.attachments || []).length > 0
        || (n.chips || []).length > 0;
    }

    // One at a time. A study has forty cards and the toggle defaults to on, so
    // an unqueued auto-run would open the page with forty model calls at once.
    const reportQueue = [];
    let reportRunning = false;
    function queueNodeReport(nodeId){
      if (nodeReports[nodeId] || reportQueue.includes(nodeId)) return;
      reportQueue.push(nodeId);
      drainReportQueue();
    }
    async function drainReportQueue(){
      if (reportRunning) return;
      reportRunning = true;
      try {
        while (reportQueue.length) await requestNodeReport(reportQueue.shift());
      } finally { reportRunning = false; }
    }

    async function requestNodeReport(nodeId, again){
      const n = nodeData[nodeId];
      if (!n || (nodeReports[nodeId] && nodeReports[nodeId].loading)) return;
      nodeReports[nodeId] = { loading: true };
      if (selectedId === nodeId) showDetail(n);
      const q = new URLSearchParams(location.search);
      const url = `/api/users/${encodeURIComponent(q.get("user_id") || "")}/sessions/${encodeURIComponent(q.get("session_id") || "")}/graph/node_report`;
      try {
        const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ node_id: nodeId, turn: document.getElementById("turn").value || null,
                                 lang: (typeof currentLang === "string" ? currentLang : "ru"), again: !!again }) });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || data.error || ("HTTP " + r.status));
        nodeReports[nodeId] = { stamp: data.stamp || "" };
        // The body comes back on the node itself with the next poll; show it now.
        if (nodeData[nodeId]) nodeData[nodeId].report = String(data.report || "");
      } catch (e) {
        nodeReports[nodeId] = { error: String(e.message || e) };
      }
      if (selectedId === nodeId && nodeData[nodeId]) showDetail(nodeData[nodeId]);
    }

    // The setting decides, and the reader may overrule it for this browser.
    function autoNodeReports(){
      try {
        const own = localStorage.getItem("graph.autoNodeReports");
        if (own === "0") return false;
        if (own === "1") return true;
      } catch (err) { /* private window */ }
      return lastGraph && lastGraph.auto_node_reports !== false;
    }
    function toggleAutoNodeReports(el){
      try { localStorage.setItem("graph.autoNodeReports", el.checked ? "1" : "0"); }
      catch (err) { /* nothing to remember it with */ }
      if (el.checked && selectedId && nodeData[selectedId]) showDetail(nodeData[selectedId]);
    }

    async function requestSummary(nodeId, again){
      const n = nodeData[nodeId];
      if (!n || (summaries[nodeId] && summaries[nodeId].loading)) return;
      summaries[nodeId] = { loading: true };
      if (selectedId === nodeId) showDetail(n);
      const q = new URLSearchParams(location.search);
      const url = `/api/users/${encodeURIComponent(q.get("user_id") || "")}/sessions/${encodeURIComponent(q.get("session_id") || "")}/graph/agent_summary`;
      try {
        const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ node_id: nodeId, turn: document.getElementById("turn").value || null,
                                 lang: (typeof currentLang === "string" ? currentLang : "ru"), again: !!again }) });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || data.error || ("HTTP " + r.status));
        summaries[nodeId] = { text: String(data.summary || ""), model: data.model || "", cached: !!data.cached,
                              stamp: stampOf(nodeData[nodeId] || n) };
      } catch (e) {
        summaries[nodeId] = { error: String(e.message || e), stamp: stampOf(nodeData[nodeId] || n) };
      }
      if (selectedId === nodeId && nodeData[nodeId]) showDetail(nodeData[nodeId]);
    }

    // An agent opens on its task and its report, then what it produced, then
    // the tool calls it made, folded, in the order they ran. A request opens
    // on the prompt, an answer on the answer, and a call nobody owns on itself.
    function showDetailClassic(n){
      const isAgent = n.kind === "agent" || n.kind === "agent_call";
      const name = n.executor_agent ? shortAgent(n.executor_agent) : String(n.label || t('graph.detail.agent'));
      const title = isAgent ? (n.stage ? n.stage + ". " : "") + name
        : n.kind === "goal" ? "❯ " + t('graph.detail.request') : n.kind === "result" ? "✔ " + t('graph.detail.answer')
        : String(n.label || n.kind || "");
      let body;
      if (n.kind === "goal") body = readable(t('graph.detail.whatAsked'), n.label, null, false, true);
      else if (n.kind === "result") body = reportBlock(t('graph.detail.answer'), n.output || n.label);
      else if (isAgent && panelTab === "report") {
        // The summary alone: what a reader came for. Everything recorded is
        // one tab away.
        body = summaryBlock(n);
      } else if (isAgent) {
        const where = n.io_source === "delegation" ? t('graph.detail.ioDelegation')
          : n.io_source === "request" ? t('graph.detail.ioRequest') : "";
        body = reportBlock(t('graph.detail.report'), n.output)
          + artifactsBlock(n.artifacts)
          + readable(t('graph.detail.task'), n.input, { agent: n.executor_agent }, false, true)
          + (where ? `<div class="note">${esc(where)}</div>` : "");
      } else if (n.kind === "decision") {
        // A decision carries the thing decided, not a call's arguments. The
        // Experiment Module's plan opens on the plan itself, then the outcome
        // the human gave it.
        body = readable(n.input && n.input.kind === "experiment_plan"
                          ? t('graph.detail.plan') : t('graph.detail.decision'),
                        n.input, null, false, true)
          + (n.verdict ? `<div class="k">${t('graph.detail.outcome')}</div>`
                         + `<div class="attr">${esc(n.verdict)}</div>` : "")
          + readable(t('graph.detail.note'), n.output, null, false, true);
      } else body = readable(t('graph.detail.arguments'), n.input) + readable(t('graph.detail.result'), n.output);
      if (isAgent && panelTab === "more") {
        // Older snapshots recorded nothing on the agent itself; say so, or
        // the panel opening on the call list reads as a missing section.
        if (!body) body = `<div class="k">${t('graph.detail.taskReport')}</div><div class="empty">${t('graph.detail.notRecorded')}</div>`;
        const calls = Array.isArray(n.calls) ? n.calls : [];
        const failed = calls.filter(c => c.status === "failed").length;
        body += calls.length
          ? `<div class="k">${t('graph.detail.toolCalls')} <span class="chars">${calls.length}${failed ? t('graph.detail.failedCount', { count: failed }) : ""}</span></div>`
            + calls.map(callRow).join("")
          : `<div class="k">${t('graph.detail.toolCalls')}</div><div class="empty">${t('graph.detail.noneRecorded')}</div>`;
      }
      if (!body) body = `<div class="empty">${t('graph.detail.empty')}</div>`;
      paint(n, headOf(n, title, isAgent ? tabsHtml() : "") + `<div class="dbody">${body}</div>`);
    }
    function closeDetail(){ selectedId=null; lastDetailStamp=null; paintedId=null;
      focusCallId=null; focusPending=false;
      document.getElementById("detail").style.display="none";
      document.getElementById("dgrip").style.display="none"; }

    // Jump from an Evidence's provenance to the exact tool call in the
    // execution log. The call is folded into its agent's card, so the agent is
    // what gets selected and the call is unfolded and lit inside it.
    // Recorders have spelled a call's node id two ways — `tool:call_x` now,
    // `goal:{invocation}::tool:call_x` before — and evidence recorded under
    // one spelling is read against the other. The call id is the tail either
    // way, so that is what is compared; an exact match still wins first.
    const callKey = id => String(id == null ? "" : id).split("::").pop();
    const sameCall = (a, b) => a === b || callKey(a) === callKey(b);

    function ownerOfCall(execId){
      for (const id in nodeData)
        if ((nodeData[id].calls || []).some(c => sameCall(c.id, execId))) return id;
      return null;
    }

    // Opened in its own tab, so following a result back to the call that
    // produced it does not cost you the graph you were reading.
    function jumpToExecution(execId){
      const q = new URLSearchParams(location.search);
      window.open("/graph?" + new URLSearchParams({
        user_id: q.get("user_id") || "", session_id: q.get("session_id") || "",
        view: "execution", call: execId,
      }), "_blank", "noopener");
    }

    // The link names a call, not a node, and not the request it belongs to —
    // calls are folded into the agent that made them. So the requests are
    // searched for the one holding it, and that is the one the page opens on.
    let wantedCall = null, revealTries = 0;
    async function openTurnHolding(execId){
      const q = new URLSearchParams(location.search);
      const base = `/api/users/${encodeURIComponent(q.get("user_id") || "")}`
                 + `/sessions/${encodeURIComponent(q.get("session_id") || "")}/graph?view=execution`;
      const holds = g => (g.nodes || []).some(
        n => (n.calls || []).some(c => sameCall(c.id, execId)));
      try {
        const first = await (await fetch(base, { cache: "no-store" })).json();
        if (holds(first)) return first.turn_id;
        for (const t of (first.turns || []).slice().reverse()) {
          if (t.turn_id === first.turn_id) continue;
          const g = await (await fetch(
            base + "&turn=" + encodeURIComponent(t.turn_id), { cache: "no-store" })).json();
          if (holds(g)) return t.turn_id;
        }
      } catch (e) { /* fall through: the newest request is still a sane landing */ }
      return null;
    }

    // Once the request is drawn, open the agent holding the call and unfold it
    // — the same highlight a jump inside one tab would have given.
    function revealWantedCall(){
      if (!wantedCall) return;
      const host = ownerOfCall(wantedCall);
      if (!host) {
        // Landing on the log with nothing selected looks like the link did
        // nothing. Say which call could not be placed and stop trying.
        if (++revealTries > 3) {
          document.getElementById("status").textContent =
