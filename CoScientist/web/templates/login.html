<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>CoScientist — Sign in</title>
  <!-- Self-contained on purpose: /static is behind the gate, so this page
       cannot load the shared stylesheet. Inline CSS keeps the login form
       working no matter what else is locked.

       The values below are the dark-theme tokens of static/css/main.css, given
       as hex because there is no Tailwind here to compose the channels. Copy
       them from there when the palette changes. They had already drifted once:
       this page still carried the retired cyan accent that main.css replaced. -->
  <style>
    :root {
      --surface: #0f1115;
      --surface-container: #191d24;
      --surface-container-high: #1f242c;
      --outline-variant: #8b929e;
      --on-surface: #e6e8eb;
      --primary: #5b9dff;
      --on-primary: #08101d;
      --error: #f08076;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      color: var(--on-surface);
      font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      max-width: 22rem;
      padding: 2rem;
      background: var(--surface-container);
      border: 1px solid var(--surface-container-high);
      border-radius: 0.75rem;
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    p.sub {
      margin: 0 0 1.5rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--outline-variant);
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--outline-variant);
    }

    input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      color: var(--on-surface);
      background: var(--surface);
      border: 1px solid var(--surface-container-high);
      border-radius: 0.375rem;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 0.6rem;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--on-primary);
      background: var(--primary);
      border: 0;
      border-radius: 0.375rem;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.1); }

    .error {
      margin: 0 0 1rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      color: var(--error);
      background: rgba(240, 128, 118, 0.08);
      border: 1px solid rgba(240, 128, 118, 0.25);
      border-radius: 0.375rem;
    }

    .error:empty { display: none; }
  </style>
</head>

<body>
  <main>
    <h1>CoScientist</h1>
    <p class="sub">Sign in</p>
    <p class="error"><!--ERROR--></p>
    <form method="post" action="/auth/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" autofocus required />
      <button type="submit">Enter</button>
    </form>
  </main>
</body>

</html>
