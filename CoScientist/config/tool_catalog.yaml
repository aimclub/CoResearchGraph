version: 1

# Presentation metadata only. Connections, credentials and tool schemas remain
# in the MCP registry and application settings. Keys are stable registry IDs.
servers:
  d6dac6fb09066080:
    priority: 0
    featured: true
    category: automl
    role: scientific
    display_name:
      ru: "Инструменты автоматического машинного обучения для научных задач — FEDOT"
      en: "Automated machine learning tools for scientific tasks — FEDOT"
    description:
      ru: "Обучение моделей на подготовленных данных о молекулах и предсказание свойств новых молекул по их структуре. Сервис запускает обучение, позволяет отслеживать его состояние и применять ранее обученные модели."
      en: "Train models on prepared molecular data and predict properties of new molecules from their structures. The service starts training, tracks its state and applies previously trained models."
  6d7e3471063c3f95:
    category: epidemiology
    role: scientific
    display_name:
      ru: "Гибридное и суррогатное моделирование эпидемий"
      en: "Hybrid and surrogate epidemic modelling"
    description:
      ru: "Моделирование распространения эпидемий на сетях, калибровка параметров, краткосрочное прогнозирование заболеваемости и анализ эпидемических пиков."
      en: "Network, hybrid and surrogate epidemic modelling, parameter calibration, short-term incidence forecasting and epidemic peak analysis."

# Shared Russian presentation for tools whose machine names may appear on more
# than one MCP server. Exact server-specific entries below take precedence.
tool_defaults:
  run_hybrid_model:
    display_name: {ru: "Запустить гибридную эпидемиологическую модель"}
    description: {ru: "Моделирует SEIR-динамику на сети и переключается на гибридную модель с выбранным методом прогноза скорости передачи инфекции."}
  hybrid_heatmap_r2:
    display_name: {ru: "Построить карты качества гибридной модели"}
    description: {ru: "Строит тепловые карты коэффициента детерминации R² гибридной модели для разных сочетаний параметров α и β."}
  run_surrogate_point:
    display_name: {ru: "Запустить суррогатную модель с точечной оценкой"}
    description: {ru: "Рассчитывает точечный прогноз заболеваемости суррогатной моделью для заданных параметров α и β."}
  run_surrogate_interval:
    display_name: {ru: "Запустить суррогатную модель с интервальной оценкой"}
    description: {ru: "Рассчитывает среднюю, нижнюю и верхнюю оценки заболеваемости суррогатной моделью для заданных параметров α и β."}
  surrogate_heatmap_r2:
    display_name: {ru: "Построить карты качества суррогатной модели"}
    description: {ru: "Строит тепловые карты R² для точечных и интервальных прогнозов суррогатной модели."}
  calibrate_model_complete_data:
    display_name: {ru: "Откалибровать модель по полной кривой заболеваемости"}
    description: {ru: "Подбирает параметры выбранной модели по полной целевой кривой методом последовательного Монте-Карло с приближёнными байесовскими вычислениями."}
  calibrate_model_complete_data_3in1:
    display_name: {ru: "Откалибровать три модели по полной кривой"}
    description: {ru: "Одновременно калибрует сетевую, гибридную и суррогатную модели по полной кривой заболеваемости методом ABC-SMC."}
  calibrate_model_forecast:
    display_name: {ru: "Откалибровать модель для краткосрочного прогноза"}
    description: {ru: "Калибрует выбранную модель по неполной кривой заболеваемости и строит краткосрочный прогноз методом ABC-SMC."}
  calibrate_model_forecast_3in1:
    display_name: {ru: "Сравнить три модели в краткосрочном прогнозе"}
    description: {ru: "Калибрует сетевую, гибридную и суррогатную модели по неполным данным и сравнивает их краткосрочные прогнозы."}
  plot_synth_peaks:
    display_name: {ru: "Визуализировать пики синтетических эпидемий"}
    description: {ru: "Строит карты времени и высоты эпидемических пиков для сетей Барабаши — Альберт и малого мира."}
  plot_synth_inc_beta:
    display_name: {ru: "Визуализировать заболеваемость и параметр β"}
    description: {ru: "Строит траектории заболеваемости и скорости передачи инфекции β для разных сетевых топологий."}
  plot_forecast_peak_errors:
    display_name: {ru: "Показать ошибки прогноза эпидемического пика"}
    description: {ru: "Сравнивает ошибки гибридного и суррогатного прогнозов до и после эпидемического пика."}
  plot_heatmap_switch:
    display_name: {ru: "Показать моменты переключения гибридной модели"}
    description: {ru: "Строит тепловые карты дней переключения и их смещения относительно эпидемического пика."}
  get_mcp_logs:
    display_name: {ru: "Получить журналы MCP-сервера"}
    description: {ru: "Показывает диагностические журналы MCP-сервера для поиска причин ошибок при выполнении задач."}
  get_s3_train_case_columns:
    display_name: {ru: "Получить столбцы обучающего набора"}
    description: {ru: "Загружает из S3 обучающий набор выбранного случая и возвращает названия его столбцов."}
  health_check:
    display_name: {ru: "Проверить доступность сервера"}
    description: {ru: "Проверяет, что MCP-сервер запущен и готов принимать запросы."}
  list_automl_train_cases:
    display_name: {ru: "Показать наборы для обучения AutoML"}
    description: {ru: "Возвращает доступные в S3 наборы данных и названия случаев, на которых можно обучить модели AutoML."}
  calculate_docking:
    display_name: {ru: "Рассчитать молекулярный докинг"}
    description: {ru: "Рассчитывает оценку связывания молекулы с белком и формирует интерактивную визуализацию результата."}
  classify_reaction:
    display_name: {ru: "Классифицировать химическую реакцию"}
    description: {ru: "Определяет класс химической реакции по записи реагентов и продуктов в формате SMILES."}
  extract_molecules:
    display_name: {ru: "Распознать молекулы на изображении"}
    description: {ru: "Находит изображения химических структур, распознаёт молекулы и возвращает их записи SMILES."}
  extract_reactions:
    display_name: {ru: "Распознать реакции на изображении"}
    description: {ru: "Находит химические реакции на изображениях и возвращает распознанные реагенты и продукты."}
  fetch_activity_data:
    display_name: {ru: "Получить данные о биологической активности"}
    description: {ru: "Загружает из BindingDB или ChEMBL данные о взаимодействии белков и лигандов и сохраняет их в CSV."}
  forward_predict:
    display_name: {ru: "Предсказать продукты реакции"}
    description: {ru: "Предсказывает возможные продукты химической реакции по заданным реагентам, условиям и растворителю."}
  name2smiles:
    display_name: {ru: "Преобразовать название молекулы в SMILES"}
    description: {ru: "Находит молекулу по названию и возвращает представление её структуры в формате SMILES."}
  retrosynthesis_tree_search:
    display_name: {ru: "Построить план ретросинтеза"}
    description: {ru: "Подбирает возможные пути синтеза целевой молекулы и ранжирует маршруты и исходные вещества."}
  smiles2name:
    display_name: {ru: "Определить название молекулы по SMILES"}
    description: {ru: "Преобразует структурную запись SMILES в систематическое название молекулы IUPAC."}
  smiles2prop:
    display_name: {ru: "Рассчитать свойства молекулы"}
    description: {ru: "Рассчитывает физико-химические дескрипторы молекулы по SMILES или названию IUPAC."}
  visualize_molecule:
    display_name: {ru: "Визуализировать молекулу"}
    description: {ru: "Строит интерактивное изображение молекулы по SMILES и возвращает ссылку для просмотра."}
  explore_my_papers:
    display_name: {ru: "Исследовать загруженные статьи"}
    description: {ru: "Отвечает на вопросы по содержанию загруженных пользователем научных статей, включая рисунки, методы и выводы."}
  explore_scientific_database:
    display_name: {ru: "Исследовать базу научных статей"}
    description: {ru: "Ищет сведения в базе научных публикаций и формирует ответ с подтверждающими фрагментами, таблицами и иллюстрациями."}
  find_papers_in_db:
    display_name: {ru: "Найти статьи в базе"}
    description: {ru: "Находит и ранжирует научные статьи, релевантные заданному вопросу или теме исследования."}
  find_relevant_data_in_db:
    display_name: {ru: "Найти данные в научной базе"}
    description: {ru: "Возвращает релевантные статьи и структурированный контекст, включая связанные изображения и подписи."}
  get_papers_database_statistics:
    display_name: {ru: "Получить статистику базы статей"}
    description: {ru: "Показывает число публикаций и их распределение по научным областям и направлениям."}
  download_papers_from_search:
    display_name: {ru: "Найти и загрузить научные статьи"}
    description: {ru: "Ищет публикации в OpenAlex, загружает доступные PDF и возвращает ссылки на сохранённые файлы."}
  search_entity:
    display_name: {ru: "Найти автора, журнал или организацию"}
    description: {ru: "Ищет в OpenAlex научного автора, источник или организацию и возвращает идентификатор для дальнейшего поиска."}
  search_papers:
    display_name: {ru: "Найти научные публикации"}
    description: {ru: "Ищет статьи в OpenAlex по ключевым словам, автору, организации, журналу, году и доступности полного текста."}
  compare_epidemic_waves:
    display_name: {ru: "Сравнить эпидемические волны"}
    description: {ru: "Сравнивает эпидемические волны по высоте и времени пика, длительности и общей нагрузке."}
  compare_influenza_age_groups_from_db:
    display_name: {ru: "Сравнить возрастные группы по гриппу"}
    description: {ru: "Сравнивает заболеваемость гриппом в возрастных группах по актуальным данным исследовательской базы."}
  compute_forecast_shap_explainability:
    display_name: {ru: "Объяснить прогноз с помощью SHAP"}
    description: {ru: "Оценивает вклад признаков в прогноз заболеваемости и сохраняет таблицы и графики SHAP."}
  describe_influenza_dataset:
    display_name: {ru: "Описать набор данных по гриппу"}
    description: {ru: "Показывает состав, временной охват, города, возрастные группы и качество данных по гриппу."}
  estimate_br_model_parameters:
    display_name: {ru: "Оценить параметры модели Барояна — Рвачёва"}
    description: {ru: "Оценивает параметры механистической эпидемиологической модели по историческим данным."}
  export_influenza_db_dataset:
    display_name: {ru: "Экспортировать данные по гриппу"}
    description: {ru: "Выгружает выбранные данные по заболеваемости гриппом из исследовательской базы."}
  export_weather_source_dataset:
    display_name: {ru: "Экспортировать метеорологические данные"}
    description: {ru: "Выгружает погодные данные, используемые как внешние признаки для эпидемиологических моделей."}
  generate_br_model_forecast:
    display_name: {ru: "Построить прогноз моделью Барояна — Рвачёва"}
    description: {ru: "Строит механистический прогноз развития эпидемии с помощью модели Барояна — Рвачёва."}
  list_influenza_db_cities:
    display_name: {ru: "Показать города в базе по гриппу"}
    description: {ru: "Возвращает список городов, для которых в базе доступны данные о заболеваемости гриппом."}
  prepare_influenza_bulletin_context:
    display_name: {ru: "Подготовить данные для бюллетеня по гриппу"}
    description: {ru: "Собирает прогнозы, сравнения волн и другие результаты в единый контекст для аналитического бюллетеня."}
  render_influenza_bulletin:
    display_name: {ru: "Сформировать бюллетень по гриппу"}
    description: {ru: "Создаёт оформленный эпидемиологический бюллетень с текстом, таблицами и графиками."}
  run_influenza_forecasting:
    display_name: {ru: "Построить прогноз заболеваемости гриппом"}
    description: {ru: "Строит прогноз на несколько недель методом градиентного бустинга с интервалами неопределённости и метриками качества."}
  generate_case_mols:
    display_name: {ru: "Сгенерировать молекулы для заданной мишени"}
    description: {ru: "Генерирует новые лекарственно-подобные молекулы с помощью предобученной модели для выбранного заболевания или белковой мишени."}
  generate_mols:
    display_name: {ru: "Сгенерировать молекулы"}
    description: {ru: "Быстро генерирует набор новых лекарственно-подобных молекул и рассчитывает базовые показатели их качества."}
  get_state_from_server:
    display_name: {ru: "Получить состояние генеративных моделей"}
    description: {ru: "Показывает зарегистрированные случаи, состояние обучения и доступность генеративных моделей."}
  list_generative_train_cases:
    display_name: {ru: "Показать наборы для обучения генеративных моделей"}
    description: {ru: "Возвращает доступные в S3 наборы молекул, на которых можно обучить генеративную модель."}
  start_generative_model_training:
    display_name: {ru: "Запустить обучение генеративной модели"}
    description: {ru: "Обучает новую генеративную модель молекул на подготовленном наборе SMILES; операция предназначена для длительного офлайн-запуска."}
  applicability_domain:
    display_name: {ru: "Оценить область применимости модели"}
    description: {ru: "Оценивает надёжность предсказаний модели для химических соединений по их положению в химическом пространстве."}
  chemical_space_clustering:
    display_name: {ru: "Кластеризовать химическое пространство"}
    description: {ru: "Группирует молекулы по структурному сходству и визуализирует полученные области химического пространства."}
  dataset_overview_heracleum_tox:
    display_name: {ru: "Обзор набора данных по токсичности борщевика"}
    description: {ru: "Показывает состав и основные характеристики набора метаболитов борщевика Сосновского."}
  estimate_synthesis_cost:
    display_name: {ru: "Оценить стоимость синтеза"}
    description: {ru: "Приближённо оценивает сложность и стоимость химического синтеза выбранных соединений."}
  model_quality:
    display_name: {ru: "Оценить качество моделей"}
    description: {ru: "Возвращает метрики качества обученных моделей, включая RMSE и ROC-AUC."}
  predict_general_toxicity:
    display_name: {ru: "Предсказать общую токсичность"}
    description: {ru: "Предсказывает гепатотоксичность, кардиотоксичность, канцерогенность и другие токсикологические показатели."}
  predict_ld50:
    display_name: {ru: "Предсказать острую токсичность LD50"}
    description: {ru: "Оценивает медианную летальную дозу LD50 соединения с учётом способа введения и химического кластера."}
  predict_molecule_profile:
    display_name: {ru: "Построить токсикологический профиль молекулы"}
    description: {ru: "Формирует комплексный профиль молекулы: LD50, токсикологические конечные точки, область применимости и стоимость синтеза."}
  reproduce_all:
    display_name: {ru: "Воспроизвести все ключевые результаты"}
    description: {ru: "Пересчитывает основные результаты исследования и сопоставляет полученные значения с опубликованными."}
  reproduce_claims:
    display_name: {ru: "Проверить воспроизводимость выводов"}
    description: {ru: "Проверяет сформулированные в статье выводы и связывает каждый из них с пересчитанными данными."}
  tavily_crawl:
    display_name: {ru: "Обойти страницы сайта"}
    description: {ru: "Обходит сайт от заданного адреса и извлекает содержимое найденных страниц с настраиваемой глубиной."}
  tavily_extract:
    display_name: {ru: "Извлечь содержимое веб-страниц"}
    description: {ru: "Загружает указанные веб-страницы и возвращает их основное содержимое в виде текста или Markdown."}
  tavily_map:
    display_name: {ru: "Построить карту сайта"}
    description: {ru: "Исследует структуру сайта и возвращает список обнаруженных страниц и адресов."}
  tavily_research:
    display_name: {ru: "Провести расширенное веб-исследование"}
    description: {ru: "Собирает и обобщает сведения из нескольких интернет-источников по заданной теме или вопросу."}
  tavily_search:
    display_name: {ru: "Найти информацию в интернете"}
    description: {ru: "Ищет актуальные сведения в интернете и возвращает краткие фрагменты с адресами источников."}
  get_datasets_info:
    display_name: {ru: "Получить сведения о наборах данных"}
    description: {ru: "Показывает доступные индексированные наборы данных, их размер, назначение и доступные столбцы."}
  search_similar:
    display_name: {ru: "Найти похожие молекулы"}
    description: {ru: "Ищет в подготовленном наборе молекулы с похожей структурой по коэффициенту Танимото."}
  antitarget_ld50_association:
    display_name: {ru: "Оценить связь антимишеней с LD50"}
    description: {ru: "Ранжирует антимишени по токсичности соединений, которые сильно с ними связываются."}
  apply_medchem_filters:
    display_name: {ru: "Применить медико-химические фильтры"}
    description: {ru: "Применяет фильтры NIH и Brenk для выделения релевантной области химического пространства."}
  binders_vs_nonbinders:
    display_name: {ru: "Сравнить связывающиеся и несвязывающиеся соединения"}
    description: {ru: "Статистически сравнивает токсичность соединений, связывающихся и не связывающихся с антимишенью."}
  butina_clustering:
    display_name: {ru: "Кластеризовать молекулы методом Бутины"}
    description: {ru: "Группирует молекулы по структурному сходству ECFP4 с помощью алгоритма кластеризации Бутины."}
  chemical_space_tsne:
    display_name: {ru: "Визуализировать химическое пространство методом t-SNE"}
    description: {ru: "Строит двумерную карту химического пространства по отпечаткам ECFP4 и значениям токсичности."}
  cluster_correlation_heatmap:
    display_name: {ru: "Построить тепловую карту корреляций"}
    description: {ru: "Показывает корреляции между докингом и токсичностью внутри крупнейших химических кластеров."}
  dataset_overview_tox_antitargets:
    display_name: {ru: "Обзор набора данных по токсичности и антимишеням"}
    description: {ru: "Показывает состав набора LD50 и антимишеней и строит распределение показателя токсичности."}
  inverse_docking_profile:
