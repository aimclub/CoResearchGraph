tools:
  "d6dac6fb09066080:train_ml":
    priority: 0
    category: automl
    role: scientific
    display_name:
      ru: "Обучить модель для предсказания свойств молекул"
      en: "Train a molecular property prediction model"
    description:
      ru: "По таблице молекул и измеренных свойств запускает автоматический подбор и обучение модели FEDOT. Возвращает идентификатор задачи для отслеживания хода обучения."
      en: "Starts FEDOT model selection and training from a table of molecules and measured properties. Returns a job identifier for tracking progress."
  "d6dac6fb09066080:predict_ml":
    priority: 1
    category: automl
    role: scientific
    display_name:
      ru: "Предсказать свойства молекул"
      en: "Predict molecular properties"
    description:
      ru: "Применяет ранее обученную модель к списку молекул или файлу с их структурами и возвращает прогнозы выбранных свойств."
      en: "Applies a previously trained model to a list or file of molecular structures and returns predictions for the selected properties."
  "d6dac6fb09066080:train_ml_job_status":
    category: automl
    role: supporting
    display_name:
      ru: "Проверить ход обучения"
      en: "Check training progress"
    description:
      ru: "Показывает состояние фоновой задачи обучения по её идентификатору."
      en: "Shows the state of a background training job by its identifier."
  "d6dac6fb09066080:check_state":
    category: automl
    role: supporting
    display_name:
      ru: "Проверить состояние модели"
      en: "Check model state"
    description:
      ru: "Возвращает состояние зарегистрированных моделей и сведения об ошибках обучения."
      en: "Returns registered model state and information about training errors."
