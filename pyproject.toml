[project]
name = "coscientist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.11"
dependencies = [
    "a2a-sdk==0.3.26",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.32",
    "fedotmas",
    "google-adk>=2.3.0",
    "greenlet>=3.5.2",
    # Imported at module scope by CoScientist/web/app.py (the /fedot-demo
    # reverse proxy) and directly by ten other modules. It used to arrive
    # transitively through google-adk, which is not a promise anyone made.
    "httpx>=0.27",
    "json-repair>=0.30.0",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.0",
    "metapub>=0.7.4",
    "motor>=3.3.2",
    "networkx>=3.6,<4.0",
    "opik>=2.0.70",
    "opentelemetry-exporter-otlp-proto-http>=1.38.0,<2.0.0",
    "pymongo>=4.6.3",
    "pyyaml>=6.0.2",
    # The ТЗ («Основание и приёмка» → GOST 19.201-78) is handed to people and
    # has to be a Word file. The NIR report's DOCX is laid out by the external
    # normcontrol MCP, whose contract is closed to GOST 7.32 alone, so there is
    # no second renderer to borrow — this is the only local one.
    "python-docx>=1.1",
    "rag-tools",
    "rank-bm25>=0.2.2",
    "rdkit>=2026.3.6",
    "sqlalchemy>=2.0.51",
]


[tool.uv.sources]
rag-tools = { git = "https://github.com/fiestaxxl/rag_tools.git" }
fedotmas = { git = "https://github.com/ITMO-NSS-team/FEDOT.MAS.git", subdirectory = "packages/fedotmas" }

[tool.setuptools]
packages = ["CoScientist"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so `pytest` works the same as `python -m pytest`
# (CoScientist is imported in-place, not installed).
pythonpath = ["."]
testpaths = ["tests"]
